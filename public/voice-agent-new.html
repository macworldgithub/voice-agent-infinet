<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfiNET Broadband • AI Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      body {
        font-family: "Inter", system-ui, sans-serif;
      }

      .mic-button {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .recording {
        animation: pulse-ring 1.8s infinite ease-in-out;
      }

      .thinking {
        animation: spin 2s linear infinite;
      }

      .speaking-glow {
        animation: glow-pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes pulse-ring {
        0% {
          box-shadow: 0 0 0 0 rgba(234, 63, 63, 0.7);
        }
        70% {
          box-shadow: 0 0 0 35px rgba(234, 63, 63, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(234, 63, 63, 0);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes glow-pulse {
        from {
          box-shadow: 0 0 20px 5px rgba(0, 191, 255, 0.3);
        }
        to {
          box-shadow: 0 0 40px 15px rgba(0, 191, 255, 0.6);
        }
      }

      .volume-bar {
        width: 6px;
        background: linear-gradient(to top, #00bfff, #67e8f9);
        border-radius: 9999px;
        transition: height 0.05s ease;
      }

      #transcript-box {
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }
      #transcript-box::-webkit-scrollbar {
        width: 4px;
      }
      #transcript-box::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }

      /* ── Fallback text input ── */
      #structured-input-container {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        transform: translateY(100%);
        opacity: 0;
        transition:
          transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.35s ease;
        pointer-events: none;
      }
      #structured-input-container.visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
      .si-backdrop {
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(100, 116, 139, 0.25);
        box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
      }
      .si-input {
        background: rgba(30, 41, 59, 0.9);
        border: 1.5px solid rgba(100, 116, 139, 0.35);
        border-radius: 14px;
        color: #f1f5f9;
        font-size: 1.05rem;
        padding: 14px 18px;
        width: 100%;
        outline: none;
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
        font-family: "Inter", system-ui, sans-serif;
      }
      .si-input:focus {
        border-color: #00bfff;
        box-shadow:
          0 0 0 3px rgba(0, 191, 255, 0.15),
          0 0 20px rgba(0, 191, 255, 0.1);
      }
      .si-input::placeholder {
        color: rgba(148, 163, 184, 0.7);
      }
      .si-submit {
        background: linear-gradient(135deg, #00bfff 0%, #0ea5e9 100%);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 14px 28px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Inter", system-ui, sans-serif;
        white-space: nowrap;
      }
      .si-submit:hover {
        background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(0, 191, 255, 0.3);
      }
      .si-submit:active {
        transform: translateY(0);
      }
      .si-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .si-label {
        color: #94a3b8;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .mic-muted-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        font-size: 0.7rem;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 500;
      }
      .fallback-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(234, 179, 8, 0.15);
        color: #fbbf24;
        font-size: 0.7rem;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 500;
        margin-left: 8px;
      }
      @keyframes si-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      .si-shake {
        animation: si-shake 0.5s ease;
      }
    </style>
  </head>

  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden"
  >
    <!-- Header -->
    <div
      class="bg-slate-900 border-b border-slate-800 px-8 py-5 flex items-center justify-between"
    >
      <div class="flex items-center gap-x-4">
        <div
          class="w-11 h-11 bg-[#00bfff] rounded-3xl flex items-center justify-center text-3xl shadow-lg"
        >
          📡
        </div>
        <div>
          <h1 class="text-3xl font-bold tracking-tight">InfiNET Broadband</h1>
          <p class="text-emerald-400 text-sm">AI Voice Assistant — Realtime</p>
        </div>
      </div>
      <button
        onclick="newSession()"
        class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium flex items-center gap-x-2 transition-colors"
      >
        New Conversation
      </button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-6 relative">
      <div class="flex flex-col items-center gap-y-8">
        <!-- Status -->
        <div
          id="status-text"
          class="text-2xl font-medium text-slate-300 text-center min-h-[64px] flex items-center"
        >
          Initializing connections...
        </div>

        <!-- Big Mic Button -->
        <button
          onclick="toggleMic()"
          id="mic-button"
          class="mic-button w-44 h-44 bg-[#00bfff] text-white rounded-full flex items-center justify-center text-7xl shadow-2xl focus:outline-none active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          🎤
        </button>

        <!-- Live Volume Indicator -->
        <div
          id="volume-container"
          class="flex items-end gap-x-1 h-16 opacity-0 transition-opacity"
        >
          <div id="bar1" class="volume-bar h-4"></div>
          <div id="bar2" class="volume-bar h-6"></div>
          <div id="bar3" class="volume-bar h-10"></div>
          <div id="bar4" class="volume-bar h-14"></div>
          <div id="bar5" class="volume-bar h-8"></div>
        </div>

        <!-- Live Transcript -->
        <div
          id="transcript-box"
          class="w-full max-w-md max-h-40 overflow-y-auto bg-slate-900/60 border border-slate-800 rounded-2xl p-4 text-sm text-slate-300 leading-relaxed hidden"
        >
          <div id="transcript-content"></div>
        </div>
      </div>

      <!-- Floating End Call Button -->
      <button
        onclick="endCall()"
        id="end-call-btn"
        class="hidden fixed bottom-10 right-10 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-3xl flex items-center gap-x-3 text-sm font-medium shadow-xl transition-all"
      >
        <span class="text-xl">✕</span>
        <span>End Call</span>
      </button>
    </div>

    <!-- Fallback Text Input (email only — shown after 3 voice failures) -->
    <div id="structured-input-container">
      <div class="si-backdrop px-6 py-6">
        <div class="max-w-md mx-auto">
          <div class="flex items-center justify-between mb-3">
            <div class="si-label">
              <span id="si-icon">📧</span>
              <span id="si-label-text">Enter your email</span>
              <span class="fallback-badge">⚠ Type instead</span>
            </div>
            <div class="mic-muted-badge"><span>🔇</span> Mic paused</div>
          </div>
          <form id="si-form" class="flex gap-3" autocomplete="off">
            <input
              id="si-input"
              class="si-input flex-1"
              type="email"
              placeholder="your.email@example.com"
              required
              autocomplete="off"
              spellcheck="false"
              inputmode="email"
            />
            <button type="submit" id="si-submit" class="si-submit">
              Submit
            </button>
          </form>
          <p class="text-slate-500 text-xs mt-2" id="si-hint">
            Voice capture unavailable — type your email and press Submit
          </p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="py-6 text-center text-xs text-slate-500">
      Powered by InfiNET Broadband
    </div>

    <script>
      (function () {
        // ─────────────────────────────────────────────────────────
        //  STATE
        // ─────────────────────────────────────────────────────────
        let socket = null;
        let micStream = null;
        let audioCtx = null;
        let pcmWorklet = null;
        let micSource = null;
        let isMicOpen = false;
        let isReady = false;
        let volumeInterval = null;
        let micMutedForInput = false;

        // Playback state
        let playbackCtx = null;
        let nextPlayTime = 0;
        let activeSources = [];
        let pcmPlaying = false;
        let assistantFullText = "";

        // ─── audio_done tracking ──────────────────────────────────
        //
        // The server emits "audio_stream_complete" when ElevenLabs
        // sends its isFinal flag — meaning ALL audio chunks have been
        // sent to the frontend.  We then watch activeSources and emit
        // "audio_done" to the server only when the LAST scheduled
        // AudioBufferSourceNode finishes playing.
        //
        // Key variables:
        //   streamComplete  – set true when server says all chunks sent
        //   audioDoneSent   – guards against emitting audio_done twice
        //                     for the same response turn
        //   audioDoneTimer  – safety-net timeout in case onended misfires
        // ─────────────────────────────────────────────────────────
        let streamComplete = false; // server signalled all chunks sent
        let audioDoneSent = false; // prevent double-emit per turn
        let audioDoneTimer = null; // safety-net timeout

        const SAMPLE_RATE = 24000;
        const PCM_SAMPLE_RATE = 16000;

        // ─────────────────────────────────────────────────────────
        //  UI HELPERS
        // ─────────────────────────────────────────────────────────
        function setStatus(msg, state) {
          const el = document.getElementById("status-text");
          const btn = document.getElementById("mic-button");
          const vol = document.getElementById("volume-container");
          const endBtn = document.getElementById("end-call-btn");

          el.textContent = msg;
          btn.classList.remove(
            "recording",
            "bg-red-500",
            "thinking",
            "bg-violet-500",
            "speaking-glow",
            "bg-[#00bfff]",
            "bg-slate-700",
          );

          if (state === "listening") {
            btn.classList.add("recording", "bg-red-500");
            btn.innerHTML =
              '<div class="flex gap-1">' +
              '<div class="w-1.5 h-5 bg-white rounded animate-pulse"></div>' +
              '<div class="w-1.5 h-8 bg-white rounded animate-pulse" style="animation-delay:.15s"></div>' +
              '<div class="w-1.5 h-4 bg-white rounded animate-pulse" style="animation-delay:.3s"></div>' +
              '<div class="w-1.5 h-7 bg-white rounded animate-pulse" style="animation-delay:.1s"></div>' +
              "</div>";
            vol.classList.add("opacity-100");
            endBtn.classList.remove("hidden");
          } else if (state === "processing") {
            btn.classList.add("thinking", "bg-violet-500");
            btn.innerHTML = "⟳";
            vol.classList.remove("opacity-100");
          } else if (state === "speaking") {
            btn.classList.add("speaking-glow", "bg-[#00bfff]");
            btn.innerHTML = "🔊";
            vol.classList.remove("opacity-100");
          } else {
            btn.classList.add("bg-[#00bfff]");
            btn.innerHTML = "🎤";
            vol.classList.remove("opacity-100");
            if (state === "idle") endBtn.classList.add("hidden");
          }
        }

        function appendTranscript(role, text) {
          const box = document.getElementById("transcript-box");
          const content = document.getElementById("transcript-content");
          box.classList.remove("hidden");
          const line = document.createElement("div");
          line.className =
            role === "user" ? "mb-2 text-cyan-300" : "mb-2 text-slate-200";
          line.innerHTML = `<span class="font-semibold text-xs uppercase tracking-wide ${
            role === "user" ? "text-cyan-500" : "text-emerald-500"
          }">${role === "user" ? "You" : "AI"}:</span> ${text}`;
          content.appendChild(line);
          box.scrollTop = box.scrollHeight;
        }

        // ─────────────────────────────────────────────────────────
        //  PCM16 CAPTURE
        // ─────────────────────────────────────────────────────────
        async function startMic() {
          if (isMicOpen) return;

          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                sampleRate: SAMPLE_RATE,
              },
            });
          } catch (e) {
            alert("Microphone access denied.");
            return;
          }

          audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
          micSource = audioCtx.createMediaStreamSource(micStream);

          const workletCode = `
class PCM16Processor extends AudioWorkletProcessor {
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      let s = Math.max(-1, Math.min(1, input[i]));
      pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
    return true;
  }
}
registerProcessor("pcm16", PCM16Processor);
`;

          try {
            const blob = new Blob([workletCode], {
              type: "application/javascript",
            });
            await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
            pcmWorklet = new AudioWorkletNode(audioCtx, "pcm16");
          } catch (e) {
            // Fallback: ScriptProcessor (deprecated but safe)
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);
            processor.port = { onmessage: null };
            processor.onaudioprocess = (ev) => {
              const input = ev.inputBuffer.getChannelData(0);
              const pcm16 = new Int16Array(input.length);
              for (let i = 0; i < input.length; i++) {
                let s = Math.max(-1, Math.min(1, input[i]));
                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
              }
              if (processor.port?.onmessage) {
                processor.port.onmessage({ data: pcm16.buffer });
              }
            };
            pcmWorklet = processor;
          }

          pcmWorklet.port.onmessage = (e) => {
            if (socket?.connected && !micMutedForInput) {
              const bytes = new Uint8Array(e.data);
              let binary = "";
              const chunkSize = 8192;
              for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(
                  null,
                  bytes.subarray(i, i + chunkSize),
                );
              }
              socket.emit("audio_chunk", btoa(binary));
            }
          };

          micSource.connect(pcmWorklet);
          pcmWorklet.connect(audioCtx.destination);
          isMicOpen = true;
          startVolumeViz();
          setStatus("Listening... Speak now", "listening");
        }

        function stopMic() {
          if (pcmWorklet) {
            pcmWorklet.disconnect();
            pcmWorklet = null;
          }
          if (micSource) {
            micSource.disconnect();
            micSource = null;
          }
          if (audioCtx) {
            audioCtx.close();
            audioCtx = null;
          }
          if (micStream) {
            micStream.getTracks().forEach((t) => t.stop());
            micStream = null;
          }
          if (volumeInterval) {
            clearInterval(volumeInterval);
            volumeInterval = null;
          }
          isMicOpen = false;
        }

        function startVolumeViz() {
          if (volumeInterval) clearInterval(volumeInterval);
          if (!audioCtx || !micSource) return;
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          micSource.connect(analyser);
          const data = new Uint8Array(analyser.frequencyBinCount);
          const bars = [1, 2, 3, 4, 5].map((i) =>
            document.getElementById("bar" + i),
          );
          volumeInterval = setInterval(() => {
            if (!isMicOpen) return;
            analyser.getByteFrequencyData(data);
            let avg = 0;
            for (let i = 0; i < 8; i++) avg += data[i];
            avg /= 8;
            const level = Math.min(Math.floor(avg / 3), 100);
            bars.forEach((bar, i) => {
              bar.style.height = `${Math.max(8, Math.floor(level * (0.6 + i * 0.1)))}px`;
            });
          }, 60);
        }

        // ─────────────────────────────────────────────────────────
        //  PCM16 AUDIO PLAYBACK + audio_done EMISSION
        //
        //  How it works:
        //
        //  1. Each audio_chunk_pcm → pushPcm16Chunk() schedules a
        //     AudioBufferSourceNode at nextPlayTime and tracks it in
        //     activeSources[].  src.onended removes it from the list
        //     and calls maybeEmitAudioDone().
        //
        //  2. Server emits "audio_stream_complete" when ElevenLabs
        //     isFinal fires (all chunks sent).  We set streamComplete=true
        //     and call maybeEmitAudioDone().
        //
        //  3. maybeEmitAudioDone() fires socket.emit("audio_done") only
        //     when BOTH conditions are true:
        //       a) streamComplete === true  (server sent everything)
        //       b) activeSources.length === 0  (browser finished playing)
        //
        //  4. A safety-net timer fires 500 ms after streamComplete in case
        //     the last onended callback never fires (e.g. interrupted
        //     source).  It checks the scheduled end time directly via
        //     playbackCtx.currentTime.
        //
        //  5. On interrupt / stopPcmPlayback, we reset streamComplete and
        //     audioDoneSent so the next turn starts clean.  We do NOT emit
        //     audio_done on interrupt — the server handles that via
        //     input_audio_buffer.speech_started already.
        // ─────────────────────────────────────────────────────────

        let audioUnlocked = false;

        async function unlockAudioOnce() {
          if (audioUnlocked) return;
          audioUnlocked = true;
          try {
            const a = new Audio();
            a.muted = true;
            a.src = "data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA";
            await a.play().catch(() => {});
            try {
              a.pause();
            } catch (_) {}
            if (!playbackCtx)
              playbackCtx = new (
                window.AudioContext || window.webkitAudioContext
              )();
            if (playbackCtx.state === "suspended")
              await playbackCtx.resume().catch(() => {});
          } catch (_) {}
        }

        // Called whenever a source ends OR when stream is marked complete.
        // Emits audio_done exactly once per AI turn.
        function maybeEmitAudioDone() {
          if (audioDoneSent) return;
          if (!streamComplete) return;
          if (activeSources.length > 0) return;

          // All chunks have finished playing and server said stream is done
          audioDoneSent = true;
          clearAudioDoneTimer();

          console.log("🔊 [audio_done] Emitting — playback fully complete");
          if (socket?.connected) {
            socket.emit("audio_done");
          }

          // Update UI to listening state
          if (isReady && isMicOpen && !micMutedForInput) {
            setStatus("Listening... Speak now", "listening");
          } else if (isReady) {
            setStatus("Ready • Tap mic to speak", "idle");
          }
        }

        // Safety-net: fires after streamComplete + small buffer.
        // Handles edge case where the last onended never fires.
        function scheduleAudioDoneTimer() {
          clearAudioDoneTimer();
          if (audioDoneSent) return;

          // Calculate how long until the last scheduled audio finishes.
          // nextPlayTime is the end timestamp in playbackCtx time.
          // Add 250 ms buffer for speaker hardware latency.
          const ctx = playbackCtx;
          if (!ctx) {
            maybeEmitAudioDone();
            return;
          }
          const remaining =
            Math.max(0, (nextPlayTime - ctx.currentTime) * 1000) + 250;
          console.log(
            `⏱️  [audio_done] Safety-net timer: ${Math.round(remaining)}ms`,
          );

          audioDoneTimer = setTimeout(() => {
            audioDoneTimer = null;
            if (!audioDoneSent) {
              console.log(
                "⏰ [audio_done] Safety-net fired — forcing audio_done",
              );
              // Clear activeSources so maybeEmitAudioDone passes
              activeSources = [];
              maybeEmitAudioDone();
            }
          }, remaining);
        }

        function clearAudioDoneTimer() {
          if (audioDoneTimer) {
            clearTimeout(audioDoneTimer);
            audioDoneTimer = null;
          }
        }

        // Reset all audio_done tracking state for a new turn
        function resetAudioDoneState() {
          streamComplete = false;
          audioDoneSent = false;
          clearAudioDoneTimer();
        }

        function interruptPlayback() {
          stopPcmPlayback();
        }

        function stopPcmPlayback() {
          pcmPlaying = false;
          nextPlayTime = 0;
          activeSources.forEach((src) => {
            try {
              src.stop(0);
            } catch (_) {}
          });
          activeSources = [];
          // Reset tracking — don't emit audio_done on interrupt
          resetAudioDoneState();
        }

        function pushPcm16Chunk(base64, sampleRate) {
          if (!base64) return;
          if (!playbackCtx)
            playbackCtx = new (
              window.AudioContext || window.webkitAudioContext
            )();

          let bin;
          try {
            bin = atob(base64);
          } catch (e) {
            return;
          }

          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

          const i16 = new Int16Array(
            bytes.buffer,
            bytes.byteOffset,
            Math.floor(bytes.byteLength / 2),
          );
          const f32 = new Float32Array(i16.length);
          for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

          const audioBuffer = playbackCtx.createBuffer(
            1,
            f32.length,
            sampleRate || PCM_SAMPLE_RATE,
          );
          audioBuffer.copyToChannel(f32, 0, 0);

          const src = playbackCtx.createBufferSource();
          src.buffer = audioBuffer;
          src.connect(playbackCtx.destination);

          const now = playbackCtx.currentTime;
          if (!pcmPlaying || nextPlayTime < now) {
            nextPlayTime = now + 0.02; // 20 ms initial jitter buffer
            pcmPlaying = true;
          }

          src.start(nextPlayTime);
          nextPlayTime += audioBuffer.duration;

          activeSources.push(src);

          src.onended = () => {
            // Remove this source from the active list
            activeSources = activeSources.filter((s) => s !== src);
            // Check if this was the last source AND stream is complete
            maybeEmitAudioDone();
          };
        }

        // ─────────────────────────────────────────────────────────
        //  FALLBACK STRUCTURED INPUT (email only)
        // ─────────────────────────────────────────────────────────
        const siContainer = document.getElementById(
          "structured-input-container",
        );
        const siForm = document.getElementById("si-form");
        const siInput = document.getElementById("si-input");
        const siSubmit = document.getElementById("si-submit");
        const siHint = document.getElementById("si-hint");

        function showFallbackInput(field, prompt) {
          if (field !== "email") {
            console.log(
              `ℹ️  Ignoring fallback input for field: ${field} (voice only)`,
            );
            return;
          }
          siInput.type = "email";
          siInput.placeholder = prompt || "your.email@example.com";
          siInput.inputMode = "email";
          siInput.value = "";
          siSubmit.disabled = false;
          siSubmit.textContent = "Submit";
          siHint.textContent =
            "Voice capture unavailable — type your email and press Submit";
          siHint.style.color = "";
          siContainer.dataset.field = field;
          siInput.setAttribute("required", "");

          micMutedForInput = true;
          console.log("🔇 Mic muted for fallback email input");

          requestAnimationFrame(() => {
            siContainer.classList.add("visible");
            setTimeout(() => siInput.focus(), 400);
          });
        }

        function hideFallbackInput() {
          siContainer.classList.remove("visible");
          siInput.value = "";
          siContainer.dataset.field = "";
          micMutedForInput = false;
          console.log("🔊 Mic unmuted after fallback input");
        }

        siForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const field = siContainer.dataset.field;
          const value = siInput.value.trim();

          if (!value) {
            siInput.classList.add("si-shake");
            setTimeout(() => siInput.classList.remove("si-shake"), 600);
            return;
          }
          if (field === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
            siInput.classList.add("si-shake");
            siHint.textContent =
              "Please enter a valid email address (e.g. name@domain.com)";
            siHint.style.color = "#f87171";
            setTimeout(() => {
              siInput.classList.remove("si-shake");
              siHint.style.color = "";
            }, 2000);
            return;
          }

          siSubmit.disabled = true;
          siSubmit.textContent = "Sending...";

          if (socket?.connected) {
            socket.emit("structured_input", {
              type: "structured_input",
              field,
              value: value.toLowerCase(),
            });
          }

          setTimeout(() => {
            hideFallbackInput();
            siSubmit.textContent = "Submit";
          }, 500);
        });

        siInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") e.preventDefault();
        });

        // ─────────────────────────────────────────────────────────
        //  SOCKET.IO
        // ─────────────────────────────────────────────────────────
        function connectSocket() {
          socket = io(window.location.origin, { transports: ["websocket"] });

          socket.on("connect", () => {
            console.log("✅ Socket.IO connected");
            setStatus("Establishing AI connections...", "processing");
          });

          socket.on("connections_ready", () => {
            console.log("✅ All connections ready");
            isReady = true;
            const btn = document.getElementById("mic-button");
            btn.disabled = false;
            btn.classList.remove("bg-slate-700");
            btn.classList.add("bg-[#00bfff]");
            if (!isMicOpen) startMic();
          });

          socket.on("status", (st) => {
            // Don't override UI while user is typing in fallback input
            if (micMutedForInput && st === "listening") return;

            if (st === "user_speaking") setStatus("Listening...", "listening");
            else if (st === "processing")
              setStatus("Thinking...", "processing");
            else if (st === "speaking")
              setStatus("AI is speaking...", "speaking");
            else if (st === "listening" && isReady)
              setStatus("Listening... Speak now", "listening");
          });

          socket.on("user_transcript", (text) =>
            appendTranscript("user", text),
          );
          socket.on("assistant_text_delta", (delta) => {
            assistantFullText += delta;
          });
          socket.on("assistant_text_done", (text) => {
            assistantFullText = "";
            appendTranscript("assistant", text);
          });

          // ── PCM audio chunks from ElevenLabs ──────────────────
          socket.on("audio_chunk_pcm", (payload) => {
            setStatus("AI is speaking...", "speaking");
            pushPcm16Chunk(payload?.audio, payload?.sampleRate);
          });

          // ── audio_stream_complete: server finished sending chunks ──
          //
          // This fires when ElevenLabs emits isFinal.  At this point all
          // chunks have been SENT but may not yet be PLAYED.  We set the
          // streamComplete flag and schedule the safety-net timer.
          // maybeEmitAudioDone() will fire audio_done when the last
          // AudioBufferSourceNode's onended callback runs.
          socket.on("audio_stream_complete", () => {
            console.log(
              "📦 [audio_stream_complete] All chunks received — waiting for playback to finish",
            );
            streamComplete = true;
            scheduleAudioDoneTimer(); // safety-net in case onended misfires
            maybeEmitAudioDone(); // fires immediately if already nothing playing
          });

          // ── Interrupts ─────────────────────────────────────────
          socket.on("interrupt", () => {
            interruptPlayback();
            if (isReady && isMicOpen && !micMutedForInput)
              setStatus("Listening... Speak now", "listening");
          });

          socket.on("audio_interrupt", () => {
            stopPcmPlayback();
            if (isReady && isMicOpen && !micMutedForInput)
              setStatus("Listening... Speak now", "listening");
          });

          // ── response.created: new AI turn starting ─────────────
          // Reset audio_done tracking so we're clean for this turn
          socket.on("assistant_text_delta", () => {
            // First delta signals a new response is streaming
            if (!streamComplete && !audioDoneSent) return; // already reset
            resetAudioDoneState();
          });

          // Reset when server starts a new response cycle
          socket.on("status", (st) => {
            if (st === "speaking") {
              // New AI turn — reset tracking for fresh audio_done cycle
              resetAudioDoneState();
            }
          });

          // ── Fallback input ─────────────────────────────────────
          socket.on("request_structured_input", (payload) => {
            console.log("📋 Fallback input requested:", payload);
            showFallbackInput(payload.field, payload.prompt);
          });

          socket.on("structured_input_accepted", (payload) => {
            console.log("✅ Input accepted:", payload);
          });

          // ── Errors & disconnect ────────────────────────────────
          socket.on("error_msg", (msg) => {
            console.error("Server error:", msg);
            setStatus("Error: " + msg, "idle");
          });

          socket.on("disconnect", () => {
            isReady = false;
            hideFallbackInput();
            resetAudioDoneState();
            setStatus("Reconnecting to server...", "processing");
          });
        }

        // ─────────────────────────────────────────────────────────
        //  CONTROLS
        // ─────────────────────────────────────────────────────────
        window.toggleMic = function () {
          unlockAudioOnce();
          if (!isReady && !socket) {
            beginSession();
            return;
          }
          if (!isReady) return;
          if (isMicOpen) {
            stopMic();
            setStatus("Mic off • Tap to resume", "idle");
          } else {
            startMic();
          }
        };

        async function beginSession() {
          const btn = document.getElementById("mic-button");
          btn.disabled = true;
          setStatus("Connecting... please wait", "processing");
          await unlockAudioOnce();
          connectSocket();
        }

        window.endCall = function () {
          stopMic();
          interruptPlayback();
          hideFallbackInput();
          micMutedForInput = false;
          if (socket) {
            socket.disconnect();
            socket = null;
          }
          isReady = false;
          const btn = document.getElementById("mic-button");
          btn.disabled = false;
          btn.classList.remove("bg-slate-700");
          btn.classList.add("bg-[#00bfff]");
          setStatus("Call ended. Tap mic to start again.", "idle");
        };

        window.newSession = function () {
          if (socket) {
            socket.disconnect();
            socket = null;
          }
          stopMic();
          interruptPlayback();
          hideFallbackInput();
          micMutedForInput = false;
          isReady = false;
          assistantFullText = "";
          document.getElementById("transcript-content").innerHTML = "";
          document.getElementById("transcript-box").classList.add("hidden");
          const btn = document.getElementById("mic-button");
          btn.disabled = false;
          btn.classList.remove("bg-slate-700");
          btn.classList.add("bg-[#00bfff]");
          setStatus("Tap the microphone to begin", "idle");
        };

        window.addEventListener("load", () => {
          setStatus("Tap the microphone to begin", "idle");
        });
      })();
    </script>
  </body>
</html>
