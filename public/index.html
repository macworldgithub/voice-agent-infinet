<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>InfiNET Support Chat</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --card: #111827;
      --card-elevated: #1a2234;
      --muted: #94a3b8;
      --text: #f1f5f9;
      --accent: #06b6d4;
      --accent-2: #6366f1;
      --accent-glow: rgba(6, 182, 212, 0.15);
      --success: #22c55e;
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(6, 182, 212, 0.5);
      --glass: rgba(17, 24, 39, 0.8);
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --vh: 1vh;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 480px) {
      :root { font-size: 14px; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(6, 182, 212, 0.1), transparent);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    @media (max-width: 480px) {
      body { padding: 0; }
    }

    .widget {
      width: 100%;
      max-width: 440px;
      height: min(calc(var(--vh, 1vh) * 94), 720px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    @media (max-width: 480px) {
      .widget {
        max-width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
      }
    }

    /* Header */
    .header {
      padding: 16px 20px;
      background: linear-gradient(180deg, var(--card-elevated) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
      position: relative;
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      opacity: 0.2;
      filter: blur(8px);
      z-index: -1;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--success);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    /* Messages */
    .messages-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .messages-wrap::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(180deg, var(--glass), transparent);
      pointer-events: none;
      z-index: 1;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 480px) {
      .messages { padding: 20px 12px; gap: 14px; }
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      animation: slideIn 0.3s ease-out forwards;
      opacity: 0;
    }

    .bubble-row.user {
      align-items: flex-end;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      position: relative;
    }

    @media (max-width: 480px) {
      .msg { 
        max-width: 88%; 
        padding: 12px 16px;
        font-size: 0.9rem;
      }
    }

    .msg.agent {
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 6px;
      color: var(--text);
    }

    .msg.user {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-radius: 18px 18px 6px 18px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .msg p { margin: 0; }
    .msg p + p { margin-top: 0.75em; }
    .msg strong { font-weight: 600; }
    .msg em { font-style: italic; }

    /* ── NEW: Link styling in agent messages ── */
    .msg.agent a {
      color: #7dd3fc;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.15s;
    }

    .msg.agent a:hover {
      color: #67e8f9;
    }

    .meta {
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 4px;
      opacity: 0.7;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Composer */
    .composer {
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      flex-shrink: 0;
      align-items: stretch;
    }

    @media (max-width: 480px) {
      .composer {
        padding: 10px;
        padding-bottom: 10px;
        gap: 10px;
      }
    }

    .input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 120px;
      resize: none;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--card-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    textarea:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      textarea {
        font-size: 16px;
        min-height: 48px;
        padding: 12px 14px;
      }
    }

    .hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.6;
    }

    .hint kbd {
      background: var(--card-elevated);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.65rem;
      border: 1px solid var(--border);
    }

    .btn {
      min-width: 56px;
      height: 48px;
      padding: 0 16px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
      align-self: flex-start;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .btn-text {
      display: inline;
    }

    @media (max-width: 480px) {
      .btn {
        min-width: 52px;
        height: 48px;
        padding: 0 14px;
      }
      .btn-text { display: none; }
    }

    /* Scrollbar */
    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.15);
    }

    /* Mobile landscape */
    @media (orientation: landscape) and (max-height: 500px) {
      .header { padding: 10px 16px; }
      .logo { width: 40px; height: 40px; }
      .messages { padding: 12px; gap: 10px; }
      .composer { padding: 10px; }
      textarea { min-height: 44px; font-size: 16px; }
      .btn { height: 44px; }
    }
  </style>
</head>
<body>
  <div class="widget" role="region" aria-label="InfiNET customer support chat">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">IN</div>
        <div class="title">
          <h1>InfiNET Support</h1>
          <p>Outages · Billing · Plans</p>
        </div>
      </div>
      <div class="status" id="status">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
    </header>

    <div class="messages-wrap">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    </div>

    <div class="composer">
      <div class="input-wrap">
        <textarea 
          id="txt" 
          placeholder="Type your message…" 
          aria-label="Chat message input"
          rows="1"
        ></textarea>
        <div class="hint">
          <span><span id="charCount">0</span> characters</span>
          <!-- <span><kbd>Shift</kbd> + <kbd>Enter</kbd> to send</span> -->
        </div>
      </div>
      <button class="btn" id="send" aria-label="Send message">
        <!-- <span class="btn-text">Send</span> -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"></path>
          <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const txt = document.getElementById('txt');
      const sendBtn = document.getElementById('send');
      const charCount = document.getElementById('charCount');

      let sessionId = null;
      let busy = false;

      function timeNow() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' })[m]);
      }

      // ── Improved: detect URLs and make them clickable ──
      function renderMarkdown(text) {
        // First escape HTML
        let safe = escapeHtml(text);

        // Convert **bold** and *italic*
        safe = safe
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>');

        // Convert newlines
        safe = safe
          .replace(/\n\s*\n/g, '</p><p>')
          .replace(/\n/g, '<br>');

        // Convert http/https/www URLs to clickable links
        safe = safe.replace(
          /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi,
          url => {
            let href = url;
            if (url.startsWith('www.')) href = 'https://' + url;
            return `<a href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>`;
          }
        );

        return `<p>${safe}</p>`.replace(/<p><\/p>/g, '');
      }

      function addMessage({ from = 'agent', text = '', meta = '' }) {
        const row = document.createElement('div');
        row.className = `bubble-row ${from === 'user' ? 'user' : ''}`;

        const msg = document.createElement('div');
        msg.className = `msg ${from}`;
        msg.innerHTML = from === 'agent' ? renderMarkdown(text) : escapeHtml(text);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta || timeNow();

        row.append(msg, metaEl);
        messagesEl.appendChild(row);
        scrollToBottom();
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'bubble-row';
        row.innerHTML = `
          <div class="typing-indicator">
            <span>Thinking</span>
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(isBusy) {
        busy = isBusy;
        sendBtn.disabled = isBusy;
        txt.disabled = isBusy;
      }

      function autoResize() {
        txt.style.height = 'auto';
        txt.style.height = Math.min(txt.scrollHeight, 120) + 'px';
      }

      async function sendMessage(hideUserMessage = false) {
        const message = txt.value.trim();
        if (!message || busy) return;

        setBusy(true);
        if (!hideUserMessage) {
          addMessage({ from: 'user', text: message });
        }
        txt.value = '';
        charCount.textContent = '0';
        autoResize();

        const typing = showTyping();

        try {
          const res = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message, channel: 'web' })
          });
          const data = await res.json();
          typing.remove();

          if (data?.text) {
            addMessage({ from: 'agent', text: data.text });

            const lowerText = data.text.toLowerCase();

            const waitPattern =
              /\b(hold on(?:\s+for\s+(?:a\s+)?moment)?|one moment(?:\s*,?\s*please)?|just(?:\s+one)?\s+moment|please wait(?:\s+while.*)?|please hold(?:\s+on)?|kindly wait|hang on|creating (?:the |your )?ticket(?: now)?)\b/;

            if (waitPattern.test(lowerText)) {
              setTimeout(() => {
                txt.value = "what's the update";
                charCount.textContent = txt.value.length;
                autoResize();
                sendMessage(true);
              }, 2000);
            }
          } else {
            addMessage({ from: 'agent', text: 'Sorry — no reply received.' });
          }
        } catch (err) {
          typing.remove();
          addMessage({ from: 'agent', text: 'Sorry — something went wrong. Try again?' });
        } finally {
          setBusy(false);
          txt.focus();
          scrollToBottom();
        }
      }

      async function init() {
        setBusy(true);
        try {
          const res = await fetch('/api/chat/init', { method: 'POST' });
          if (!res.ok) throw new Error();
          const data = await res.json();
          sessionId = data.sessionId;
          addMessage({ from: 'agent', text: data.text || 'Hello, thank you for contacting InfiNET Broadband. I am your AI assistant. Nice to meet you.' });
        } catch {
          addMessage({ from: 'agent', text: 'Connection issue. Please try again later.' });
        } finally {
          setBusy(false);
        }
      }

      sendBtn.addEventListener('click', () => sendMessage());

      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      txt.addEventListener('input', () => {
        charCount.textContent = txt.value.length;
        autoResize();
      });

      function scrollToBottom() {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      function updateLayout() {
        const widget = document.querySelector('.widget');
        if (!widget) return;
        
        if (window.innerWidth <= 480) {
          let viewportHeight;
          if (window.visualViewport) {
            viewportHeight = window.visualViewport.height;
            const offsetTop = window.visualViewport.offsetTop;
            widget.style.top = offsetTop + 'px';
          } else {
            viewportHeight = window.innerHeight;
            widget.style.top = '0';
          }
          widget.style.height = viewportHeight + 'px';
          widget.style.minHeight = viewportHeight + 'px';
          widget.style.maxHeight = viewportHeight + 'px';
          widget.style.bottom = 'auto';
        }
        scrollToBottom();
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateLayout);
        window.visualViewport.addEventListener('scroll', updateLayout);
      }
      window.addEventListener('resize', updateLayout);

      txt.addEventListener('focus', () => {
        setTimeout(updateLayout, 10);
        setTimeout(updateLayout, 100);
        setTimeout(updateLayout, 200);
        setTimeout(updateLayout, 400);
      });

      txt.addEventListener('blur', () => {
        setTimeout(updateLayout, 50);
        setTimeout(updateLayout, 200);
      });

      updateLayout();

      const observer = new MutationObserver(scrollToBottom);
      observer.observe(messagesEl, { childList: true });

      init();

      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!txt.disabled) txt.focus();
          scrollToBottom();
        }, 100);
      });

      window._infinetChatHelpers = { updateLayout, scrollToBottom };
    })();
  </script>
</body>
</html>
