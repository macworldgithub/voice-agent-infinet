<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#071025" />
  <title>InfiNET Support Chat</title>
  <style>
    :root {
      --bg: #071025;
      --card: #081224;
      --muted: #a0b3d0;
      --accent: #00c2b3;
      --accent-2: #3b82f6;
      --glass: rgba(255,255,255,0.035);
      --radius: 16px;
      --fs-base: clamp(13.5px, 3.1vw, 15px);
      --spacing: clamp(10px, 3vw, 16px);
      --vh: 1vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base);
      color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }
    body {
      height: 100%;
      width: 100%;
      background: linear-gradient(165deg, #031022 0%, #0b223f 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: fixed;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .widget {
      width: min(100%, 420px);
      height: min(calc(var(--vh, 1vh) * 96), 760px);
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      -webkit-user-select: text;
      user-select: text;
    }

    .header {
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(59,130,246,0.09), rgba(0,194,179,0.06));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .brand { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      flex: 1; 
    }

    .logo {
      width: 42px; 
      height: 42px; 
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white; 
      font-weight: 700; 
      font-size: 15px;
      display: grid; 
      place-items: center;
      box-shadow: 0 3px 10px rgba(59,130,246,0.3);
      flex-shrink: 0;
    }

    .title h4 { 
      font-size: clamp(14.5px, 3.8vw, 16px); 
      font-weight: 600;
    }

    .title p { 
      font-size: clamp(11px, 2.9vw, 12px); 
      color: var(--muted); 
      margin-top: 2px; 
    }

    .status { 
      display: flex; 
      align-items: center; 
      gap: 7px; 
      font-size: clamp(11px, 2.9vw, 12.5px); 
      color: var(--muted); 
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot { 
      width: 9px; 
      height: 9px; 
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online { 
      background: #22c55e; 
      box-shadow: 0 0 6px #22c55e80; 
    }

    .messages-wrap { 
      flex: 1; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1; 
      overflow-y: auto; 
      overflow-x: hidden;
      padding: var(--spacing);
      display: flex; 
      flex-direction: column; 
      gap: clamp(10px, 3vw, 14px);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      -webkit-user-select: text;
      user-select: text;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.25);
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0;
      padding: 0;
    }

    .bubble-row.user {
      align-items: flex-end;
    }

    .msg {
      max-width: 84%;
      padding: clamp(9px, 2.8vw, 12px) clamp(12px, 3.5vw, 15px);
      border-radius: 15px;
      line-height: 1.45;
      font-size: clamp(13.5px, 3.4vw, 14.5px);
      animation: appear 0.24s ease-out forwards;
      opacity: 0;
      transform: translateY(8px);
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
      -webkit-user-modify: read-only;
    }

    .msg.agent {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 15px 15px 15px 5px;
    }

    .msg.user {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-radius: 15px 15px 5px 15px;
    }

    .msg p { 
      margin: 0;
      -webkit-user-select: text;
      user-select: text;
    }

    .msg p + p { 
      margin-top: 8px; 
    }

    .msg strong { 
      font-weight: 600; 
    }

    .msg em { 
      font-style: italic; 
    }

    .meta {
      margin-top: 4px;
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--muted);
      opacity: 0.8;
    }

    .bubble-row.user .meta { 
      text-align: right; 
    }

    @keyframes appear { 
      to { opacity: 1; transform: none; } 
    }

    .composer {
      padding: clamp(10px, 3vw, 14px) var(--spacing);
      padding-bottom: max(clamp(10px, 3vw, 14px), calc(env(safe-area-inset-bottom) + 10px));
      background: rgba(0,0,0,0.28);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      align-items: stretch;
      -webkit-user-select: text;
      user-select: text;
    }

    .input-wrap { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 5px;
      min-width: 0;
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 120px;
      resize: vertical;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      color: inherit; 
      font: inherit; 
      outline: none; 
      line-height: 1.42;
      font-size: 16px;
      -webkit-user-select: text;
      user-select: text;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22);
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .hint { 
      font-size: clamp(10px, 2.7vw, 11.5px); 
      color: var(--muted); 
      display: flex; 
      justify-content: space-between; 
      padding: 0 5px;
      min-height: 16px;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      color: white; 
      font-weight: 600; 
      font-size: clamp(13px, 3.4vw, 14.5px);
      min-width: 62px; 
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 0.2s ease, transform 0.1s ease;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) { 
      opacity: 0.94; 
      transform: translateY(-1px); 
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled { 
      opacity: 0.48; 
      cursor: not-allowed; 
    }

    .typing-indicator {
      display: flex; 
      align-items: center; 
      gap: 8px;
      padding: 10px 16px; 
      background: rgba(255,255,255,0.03);
      border-radius: 18px 18px 18px 4px; 
      font-size: 14px; 
      color: var(--muted);
      max-width: 84%;
      -webkit-user-select: none;
      user-select: none;
    }

    .typing-dots { 
      display: flex; 
      gap: 4px; 
    }

    .typing-dot { 
      width: 6px; 
      height: 6px; 
      background: var(--muted); 
      border-radius: 50%; 
      animation: typing 1.4s infinite ease-in-out; 
    }

    .typing-dot:nth-child(2) { 
      animation-delay: 0.2s; 
    }

    .typing-dot:nth-child(3) { 
      animation-delay: 0.4s; 
    }

    @keyframes typing { 
      0%, 100% { transform: translateY(0); } 
      50% { transform: translateY(-6px); } 
    }

    /* TABLET */
    @media (max-width: 900px) {
      .widget {
        width: min(100%, 450px);
      }
    }

    /* MOBILE */
    @media (max-width: 720px) {
      body { 
        padding: 0;
      }

      .widget {
        position: fixed;
        left: env(safe-area-inset-left, 8px);
        right: env(safe-area-inset-right, 8px);
        top: env(safe-area-inset-top, 8px);
        bottom: env(safe-area-inset-bottom, 8px);
        width: auto;
        height: auto;
        margin: 0;
        border-radius: 14px;
      }

      .header {
        padding: 10px 12px;
      }

      .logo {
        width: 38px;
        height: 38px;
        font-size: 14px;
      }

      .title h4 {
        font-size: 15px;
      }

      .title p {
        font-size: 11px;
      }

      .messages-wrap {
        min-height: 120px;
      }

      .messages {
        padding: 10px;
        gap: 10px;
      }

      .composer {
        padding: 10px;
        padding-bottom: max(10px, calc(env(safe-area-inset-bottom) + 5px));
        gap: 8px;
      }

      textarea { 
        font-size: 16px; 
        min-height: 50px;
        max-height: 100px;
        padding: 10px 12px;
      }

      .btn { 
        padding: 0 16px;
        min-width: 56px;
      }

      .msg {
        max-width: 85%;
      }

      .input-wrap {
        gap: 4px;
      }

      .hint {
        font-size: 10px;
        min-height: 14px;
      }
    }

    @media (max-width: 480px) {
      :root {
        --spacing: clamp(8px, 2vw, 12px);
      }

      .widget {
        border-radius: 12px;
      }

      .header {
        padding: 8px 10px;
        gap: 8px;
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 13px;
      }

      .title h4 {
        font-size: 14px;
      }

      .title p {
        font-size: 10px;
      }

      .status {
        font-size: 11px;
      }

      .messages {
        padding: 8px;
        gap: 8px;
      }

      .composer {
        padding: 8px;
        padding-bottom: max(8px, calc(env(safe-area-inset-bottom) + 4px));
        gap: 6px;
      }

      textarea {
        min-height: 44px;
        max-height: 88px;
        padding: 8px 10px;
        font-size: 16px;
      }

      .btn {
        padding: 0 14px;
        min-width: 50px;
        font-size: 13px;
      }

      .msg {
        max-width: 86%;
        font-size: 13px;
        padding: 8px 10px;
      }

      .typing-indicator {
        font-size: 13px;
        padding: 8px 12px;
      }

      .hint {
        font-size: 9px;
      }
    }

    /* Landscape Mode */
    @media (orientation: landscape) {
      .widget {
        max-height: calc(var(--vh, 1vh) * 90);
      }

      .messages-wrap {
        min-height: 60px;
      }

      textarea {
        max-height: 80px;
      }

      .msg {
        font-size: 13px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .header {
        padding: 6px 10px;
      }

      .messages {
        padding: 6px;
        gap: 6px;
      }

      .composer {
        padding: 6px;
      }

      textarea {
        min-height: 38px;
        max-height: 60px;
        font-size: 16px;
      }

      .logo {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="widget" role="region" aria-label="InfiNET customer support chat">
    <div class="header">
      <div class="brand">
        <div class="logo">IN</div>
        <div class="title">
          <h4>InfiNET Support</h4>
          <p>Outages · Billing · Plans</p>
        </div>
      </div>
      <div class="status" id="status">
        <div class="dot online" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages" aria-live="polite" aria-atomic="false"></div>
    </div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="txt" placeholder="Type your message…" aria-label="Chat message input"></textarea>
        <div class="hint">
          <span id="charCount">0</span>
        </div>
      </div>
      <button class="btn" id="send" type="button">Send</button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const txt = document.getElementById('txt');
      const sendBtn = document.getElementById('send');
      const widgetEl = document.querySelector('.widget');

      let sessionId = null;
      let busy = false;

      function timeNow() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' })[m]);
      }

      function renderMarkdown(text) {
        let html = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\n\s*\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
      }

      function addMessage({ from = 'agent', text = '', meta = '' }) {
        const row = document.createElement('div');
        row.className = `bubble-row ${from === 'user' ? 'user' : ''}`;

        const msg = document.createElement('div');
        msg.className = `msg ${from}`;
        msg.innerHTML = from === 'agent' ? renderMarkdown(text) : escapeHtml(text);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta || timeNow();

        row.append(msg, metaEl);
        messagesEl.appendChild(row);
        scrollToBottom();
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'bubble-row';
        row.innerHTML = `
          <div class="typing-indicator">
            <span>Thinking</span>
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(isBusy) {
        busy = isBusy;
        sendBtn.disabled = isBusy;
        txt.disabled = isBusy;
      }

      async function sendMessage() {
        const message = txt.value.trim();
        if (!message || busy) return;

        setBusy(true);
        addMessage({ from: 'user', text: message });
        txt.value = '';
        document.getElementById('charCount').textContent = '0';

        const typing = showTyping();

        try {
          const res = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message, channel: 'web' })
          });
          const data = await res.json();
          typing.remove();

          if (data?.text) {
            addMessage({ from: 'agent', text: data.text });

            const lowerText = data.text.toLowerCase();
            if (lowerText.includes('hold on for a moment') || lowerText.includes('creating the ticket now')) {
              setTimeout(() => {
                txt.value = "what's the update";
                document.getElementById('charCount').textContent = txt.value.length;
                sendMessage();
              }, 2000);
            }
          } else {
            addMessage({ from: 'agent', text: 'Sorry — no reply received.' });
          }
        } catch (err) {
          typing.remove();
          addMessage({ from: 'agent', text: 'Sorry — something went wrong. Try again?' });
        } finally {
          setBusy(false);
          txt.focus();
          scrollToBottom();
        }
      }

      async function init() {
        setBusy(true);
        try {
          const res = await fetch('/api/chat/init', { method: 'POST' });
          if (!res.ok) throw new Error();
          const data = await res.json();
          sessionId = data.sessionId;
          addMessage({ from: 'agent', text: data.text || 'Hello, thank you for contacting InfiNET Broadband. I am your AI assistant. Nice to meet you.' });
        } catch {
          addMessage({ from: 'agent', text: 'Connection issue. Please try again later.' });
        } finally {
          setBusy(false);
        }
      }

      function scrollToBottom() {
        window.requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      function updateVh() {
        let viewportHeight = window.innerHeight;
        
        if (window.visualViewport) {
          viewportHeight = window.visualViewport.height;
        }
        
        const newVh = (viewportHeight * 0.01);
        document.documentElement.style.setProperty('--vh', newVh + 'px');
      }

      // Handle visual viewport changes (keyboard appears/disappears)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          updateVh();
          scrollToBottom();
        });

        window.visualViewport.addEventListener('scroll', () => {
          scrollToBottom();
        });
      }

      // Window resize as fallback
      window.addEventListener('resize', () => {
        updateVh();
        scrollToBottom();
      });

      // Textarea focus handling
      txt.addEventListener('focus', () => {
        setTimeout(() => {
          updateVh();
          scrollToBottom();
        }, 100);
      });

      txt.addEventListener('blur', () => {
        setTimeout(updateVh, 100);
      });

      // Input counter
      txt.addEventListener('input', () => {
        document.getElementById('charCount').textContent = txt.value.length;
      });

      // Send button click
      sendBtn.addEventListener('click', sendMessage);

      // Keyboard shortcuts
      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Auto-scroll on message mutations
      const observer = new MutationObserver(() => {
        scrollToBottom();
      });
      observer.observe(messagesEl, { childList: true });

      // Initial setup
      updateVh();
      init();

      // Focus after load
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!txt.disabled) txt.focus();
          scrollToBottom();
        }, 100);
      });

      // Expose helpers
      window._infinetChatHelpers = { updateVh, scrollToBottom };
    })();
  </script>
</body>
</html>
