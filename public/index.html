<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>InfiNET Support Chat</title>
  <style>
    :root {
      --bg: #071025;
      --card: #081224;
      --muted: #a0b3d0;
      --accent: #00c2b3;
      --accent-2: #3b82f6;
      --glass: rgba(255,255,255,0.035);
      --radius: 16px;
      --fs-base: clamp(13.5px, 3.1vw, 15px);
      --spacing: clamp(10px, 3vw, 16px);
      /* --vh will be updated by JS to the real viewport height unit */
      --vh: 1vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base);
      color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: linear-gradient(165deg, #031022 0%, #0b223f 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      /* avoid 100vh quirks on iOS by using dynamic --vh set from JS */
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .widget {
      width: min(100%, 420px);
      height: min(calc(var(--vh, 1vh) * 96), 760px);
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }

    .header {
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(59,130,246,0.09), rgba(0,194,179,0.06));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex: 1; }
    .logo {
      width: 42px; height: 42px; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white; font-weight: 700; font-size: 15px;
      display: grid; place-items: center;
      box-shadow: 0 3px 10px rgba(59,130,246,0.3);
    }
    .title h4 { font-size: clamp(14.5px, 3.8vw, 16px); }
    .title p { font-size: clamp(11px, 2.9vw, 12px); color: var(--muted); margin-top: 2px; }
    .status { display: flex; align-items: center; gap: 7px; font-size: clamp(11px, 2.9vw, 12.5px); color: var(--muted); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }

    .messages-wrap { 
      flex: 1; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      /* Fix for iOS flexbox overflow: allow children to shrink properly */
      min-height: 0;
    }
    .messages {
      flex: 1; 
      overflow-y: auto; 
      padding: var(--spacing);
      display: flex; 
      flex-direction: column; 
      gap: clamp(10px, 3vw, 14px);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      /* Force compositing and avoid iOS repaint issues */
      transform: translateZ(0);
      /* Fix iOS flex overflow */
      min-height: 0;
      will-change: scroll-position;
    }
    .bubble-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .bubble-row.user {
      align-items: flex-end;
    }
    .msg {
      max-width: 84%;
      padding: clamp(9px, 2.8vw, 12px) clamp(12px, 3.5vw, 15px);
      border-radius: 15px;
      line-height: 1.45;
      font-size: clamp(13.5px, 3.4vw, 14.5px);
      animation: appear 0.24s ease-out forwards;
      opacity: 0;
      transform: translateY(8px);
      word-break: break-word;
      background-clip: padding-box;
    }
    .msg.agent {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 15px 15px 15px 5px;
    }
    .msg.user {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-radius: 15px 15px 5px 15px;
    }
    .meta {
      margin-top: 4px;
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--muted);
      opacity: 0.8;
    }
    .bubble-row.user .meta { text-align: right; }

    @keyframes appear { to { opacity:1; transform:none; } }

    /* Composer: keep original horizontal layout, allow children to stretch so Send matches input height */
    .composer {
      padding: clamp(10px, 3vw, 14px) var(--spacing);
      background: rgba(0,0,0,0.28);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      align-items: stretch;
    }
    .input-wrap { flex: 1; display: flex; flex-direction: column; gap: 5px; }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 140px;
      resize: vertical;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      color: inherit; font: inherit; outline: none; line-height: 1.42;
      font-size: inherit;
      /* prevent iOS automatic zoom when focusing by keeping >=16px on mobile via JS */
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22); }

    .hint { font-size: clamp(10px, 2.7vw, 11.5px); color: var(--muted); display: flex; justify-content: space-between; padding: 0 5px; }

    .btn {
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      color: white; font-weight: 600; font-size: clamp(13px, 3.4vw, 14.5px);
      min-width: 62px; cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
    }
    .btn:hover:not(:disabled) { opacity: 0.94; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }

    .typing-indicator {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: rgba(255,255,255,0.03);
      border-radius: 18px 18px 18px 4px; font-size: 14px; color: var(--muted);
      max-width: 84%;
    }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dot { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    /* MOBILE-SPECIFIC */
    @media (max-width: 720px) {
      body { padding: 0; }

      .widget {
        position: fixed;
        left: 8px;
        right: 8px;
        top: calc(8px + env(safe-area-inset-top));
        bottom: calc(env(safe-area-inset-bottom) + 8px);
        width: auto;
        height: auto;
        max-height: calc(var(--vh, 1vh) * 96);
        border-radius: 14px;
      }

      .composer {
        padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
        z-index: 5;
      }

      /* ensure >=16px on mobile to prevent browser auto-zoom */
      textarea { font-size: 16px; min-height: 54px; }

      /* keep send button same padding but let it stretch vertically with composer */
      .btn { padding: 0 18px; }

      .messages { padding-bottom: calc(var(--spacing) + 10px); }
    }

    @media (orientation: landscape) and (max-height: 420px) {
      textarea { font-size: 16px; }
      .btn { padding: 0 18px; }
    }
  </style>
</head>
<body>
  <div class="widget" role="region" aria-label="InfiNET customer support chat">
    <div class="header">
      <div class="brand">
        <div class="logo">IN</div>
        <div class="title">
          <h4>InfiNET Support</h4>
          <p>Outages · Billing · Plans</p>
        </div>
      </div>
      <div class="status" id="status">
        <div class="dot online" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages" aria-live="polite"></div>
    </div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="txt" placeholder="Type your message…" aria-label="Chat message input" rows="1"></textarea>
        <div class="hint">
          <span id="charCount">0</span>
        </div>
      </div>
      <button class="btn" id="send">Send</button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const txt = document.getElementById('txt');
      const sendBtn = document.getElementById('send');
      const charCount = document.getElementById('charCount');

      let sessionId = null;
      let busy = false;

      // Helpers
      function timeNow() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' })[m]);
      }
      function renderMarkdown(text) {
        let html = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\n\s*\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
      }

      function addMessage({ from = 'agent', text = '', meta = '' }) {
        const row = document.createElement('div');
        row.className = `bubble-row ${from === 'user' ? 'user' : ''}`;

        const msg = document.createElement('div');
        msg.className = `msg ${from}`;
        msg.innerHTML = from === 'agent' ? renderMarkdown(text) : escapeHtml(text);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta || timeNow();

        row.append(msg, metaEl);
        messagesEl.appendChild(row);
        // ensure browser paints new content then scroll
        requestAnimationFrame(() => scrollToBottom());
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'bubble-row';
        row.innerHTML = `
          <div class="typing-indicator">
            <span>Thinking</span>
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(isBusy) {
        busy = isBusy;
        sendBtn.disabled = isBusy;
        txt.disabled = isBusy;
      }

      async function sendMessage() {
        const message = txt.value.trim();
        if (!message || busy) return;

        setBusy(true);
        addMessage({ from: 'user', text: message });
        txt.value = '';
        charCount.textContent = '0';

        const typing = showTyping();

        try {
          const res = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message, channel: 'web' })
          });
          const data = await res.json();
          typing.remove();

          if (data?.text) {
            addMessage({ from: 'agent', text: data.text });

            // AUTO FOLLOW-UP example preserved (but harmless)
            const lowerText = data.text.toLowerCase();
            if (lowerText.includes('hold on for a moment') || lowerText.includes('creating the ticket now')) {
              setTimeout(() => {
                txt.value = "what's the update";
                charCount.textContent = txt.value.length;
                sendMessage();
              }, 2000);
            }
          } else {
            addMessage({ from: 'agent', text: 'Sorry — no reply received.' });
          }
        } catch (err) {
          typing.remove();
          addMessage({ from: 'agent', text: 'Sorry — something went wrong. Try again?' });
        } finally {
          setBusy(false);
          // focus back on input for quick follow-up
          txt.focus();
          scrollToBottom();
        }
      }

      async function init() {
        setBusy(true);
        try {
          // safe attempt to init session
          const res = await fetch('/api/chat/init', { method: 'POST' });
          if (!res.ok) throw new Error();
          const data = await res.json();
          sessionId = data.sessionId;
          addMessage({ from: 'agent', text: data.text || 'Hi there! Welcome to InfiNET Broadband. Could you please share your name to get started?' });
        } catch {
          addMessage({ from: 'agent', text: 'Connection issue. Please try again later.' });
        } finally {
          setBusy(false);
          // ensure bottom scroll after messages are present
          setTimeout(scrollToBottom, 80);
          setTimeout(scrollToBottom, 300);
        }
      }

      // events
      sendBtn.addEventListener('click', sendMessage);

      // send on Enter (no Shift); Shift+Enter creates newline.
      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      txt.addEventListener('input', () => {
        charCount.textContent = txt.value.length;
      });

      function scrollToBottom() {
        // some devices require a small timeout to let the visualViewport settle
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      // MOBILE: dynamic --vh to handle address bar/keyboard changes and compute keyboard inset
      function updateVhAndInsets() {
        // Set --vh to current visual viewport (or fallback)
        const vHeight = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--vh', (vHeight * 0.01) + 'px');

        // Adjust messages bottom padding when keyboard opens (so content isn't hidden)
        let spacingPx = 12; // default
        try {
          const raw = getComputedStyle(document.documentElement).getPropertyValue('--spacing') || '';
          // try to parse px value or clamp result containing px
          const pxMatch = raw.match(/([0-9]+)px/);
          if (pxMatch) spacingPx = parseInt(pxMatch[1], 10);
        } catch (e) { /* ignore */ }

        let keyboardInset = 0;
        if (window.visualViewport) {
          // keyboard height is difference between layout viewport and visual viewport
          keyboardInset = Math.max(0, window.innerHeight - window.visualViewport.height);
        }
        // also respect safe-area inset bottom if present (approximate)
        const safeAreaBottom = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0;

        // apply padding: base spacing + keyboardInset + small margin (16)
        const desiredPadding = spacingPx + keyboardInset + safeAreaBottom + 16;
        messagesEl.style.paddingBottom = desiredPadding + 'px';
      }

      // listen to visualViewport changes (mobile keyboard + address bar)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => { updateVhAndInsets(); scrollToBottom(); });
        window.visualViewport.addEventListener('scroll', () => { updateVhAndInsets(); });
      } else {
        window.addEventListener('resize', () => { updateVhAndInsets(); scrollToBottom(); });
      }

      txt.addEventListener('focus', () => {
        // make sure font-size is at least 16px on mobile to avoid auto-zoom on iOS
        // (we already set >=16px in mobile CSS, but ensure here too)
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          txt.style.fontSize = '16px';
        }
        updateVhAndInsets();
        // multiple delayed scrolls help on iOS where keyboard opens after focus event
        setTimeout(scrollToBottom, 60);
        setTimeout(scrollToBottom, 220);
        setTimeout(scrollToBottom, 500);
      });

      txt.addEventListener('blur', () => {
        setTimeout(updateVhAndInsets, 80);
        setTimeout(scrollToBottom, 120);
      });

      // Mutation observer to always scroll when new messages are appended
      const observer = new MutationObserver(() => { scrollToBottom(); });
      observer.observe(messagesEl, { childList: true, subtree: true });

      // init on load
      updateVhAndInsets();
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!txt.disabled) txt.focus();
          scrollToBottom();
        }, 100);
      });

      // expose a small helper for debugging in console
      window._infinetChatHelpers = { updateVhAndInsets, scrollToBottom };

      // Finally start chat
      init();
    })();
  </script>
</body>
</html>
