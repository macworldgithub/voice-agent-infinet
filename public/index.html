<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>InfiNET Support Chat</title>
  <style>
    :root {
      --bg: #071025;
      --card: #081224;
      --muted: #a0b3d0;
      --accent: #00c2b3;
      --accent-2: #3b82f6;
      --glass: rgba(255,255,255,0.035);
      --radius: 16px;
      --fs-base: clamp(13.5px, 3.1vw, 15px);
      --spacing: clamp(10px, 3vw, 16px);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base);
      color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(165deg, #031022 0%, #0b223f 100%);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .widget {
      width: min(100%, 420px);
      height: min(100%, 760px);
      max-height: 100%;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
    }

    .header {
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(59,130,246,0.09), rgba(0,194,179,0.06));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(59,130,246,0.3);
    }

    .title h4 {
      font-size: clamp(14.5px, 3.8vw, 16px);
      font-weight: 600;
    }

    .title p {
      font-size: clamp(11px, 2.9vw, 12px);
      color: var(--muted);
      margin-top: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(11px, 2.9vw, 12.5px);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e80;
    }

    .messages-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--spacing);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 3vw, 14px);
      scroll-behavior: smooth;
      min-height: 0;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .bubble-row.user {
      align-items: flex-end;
    }

    .msg {
      max-width: 84%;
      padding: clamp(9px, 2.8vw, 12px) clamp(12px, 3.5vw, 15px);
      border-radius: 15px;
      line-height: 1.45;
      font-size: clamp(13.5px, 3.4vw, 14.5px);
      animation: appear 0.24s ease-out forwards;
      opacity: 0;
      transform: translateY(8px);
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }

    .msg.agent {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 15px 15px 15px 5px;
    }

    .msg.agent p {
      margin: 0;
    }

    .msg.agent p + p {
      margin-top: 10px;
    }

    .msg.user {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-radius: 15px 15px 5px 15px;
    }

    .meta {
      margin-top: 4px;
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--muted);
      opacity: 0.8;
    }

    .bubble-row.user .meta {
      text-align: right;
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .composer {
      padding: clamp(10px, 3vw, 14px) var(--spacing);
      padding-bottom: max(clamp(10px, 3vw, 14px), env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.28);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      align-items: stretch;
      z-index: 10;
    }

    .input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 140px;
      resize: vertical;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      color: inherit;
      font: inherit;
      outline: none;
      line-height: 1.42;
      -webkit-appearance: none;
      -webkit-user-select: text;
      user-select: text;
      font-size: 16px;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22);
      -webkit-box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22);
    }

    .hint {
      font-size: clamp(10px, 2.7vw, 11.5px);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: clamp(13px, 3.4vw, 14.5px);
      min-width: 62px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      -webkit-appearance: none;
      -webkit-user-select: none;
      user-select: none;
      flex-shrink: 0;
    }

    .btn:active:not(:disabled) {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 18px 18px 18px 4px;
      font-size: 14px;
      color: var(--muted);
      max-width: 84%;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    /* TABLET & UP */
    @media (min-width: 721px) {
      body {
        padding: 8px;
      }

      .widget {
        border-radius: 20px;
      }
    }

    /* MOBILE */
    @media (max-width: 720px) {
      body {
        padding: 0;
      }

      .widget {
        width: 100%;
        height: 100%;
        max-height: 100%;
        border-radius: 0;
      }

      .header {
        border-radius: 0;
      }

      .messages {
        padding-bottom: calc(var(--spacing) + 10px);
      }
    }

    /* LANDSCAPE ADJUSTMENTS */
    @media (orientation: landscape) and (max-height: 500px) {
      textarea {
        min-height: 40px;
        max-height: 80px;
      }

      .header {
        padding: 8px 16px;
      }

      .messages {
        padding: 8px;
      }

      .composer {
        padding: 8px var(--spacing);
      }
    }
  </style>
</head>
<body>
  <div class="widget" role="region" aria-label="InfiNET customer support chat">
    <div class="header">
      <div class="brand">
        <div class="logo">IN</div>
        <div class="title">
          <h4>InfiNET Support</h4>
          <p>Outages · Billing · Plans</p>
        </div>
      </div>
      <div class="status" id="status">
        <div class="dot online" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    </div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="txt" placeholder="Type your message…" aria-label="Chat message input"></textarea>
        <div class="hint">
          <span id="charCount">0</span>
        </div>
      </div>
      <button class="btn" id="send" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const txt = document.getElementById('txt');
      const sendBtn = document.getElementById('send');

      let sessionId = null;
      let busy = false;

      function timeNow() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' })[m]);
      }

      function renderMarkdown(text) {
        let html = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\n\s*\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
      }

      function addMessage({ from = 'agent', text = '', meta = '' }) {
        const row = document.createElement('div');
        row.className = `bubble-row ${from === 'user' ? 'user' : ''}`;

        const msg = document.createElement('div');
        msg.className = `msg ${from}`;
        msg.innerHTML = from === 'agent' ? renderMarkdown(text) : escapeHtml(text);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta || timeNow();

        row.append(msg, metaEl);
        messagesEl.appendChild(row);
        scrollToBottom();
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'bubble-row';
        row.innerHTML = `
          <div class="typing-indicator">
            <span>Thinking</span>
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(isBusy) {
        busy = isBusy;
        sendBtn.disabled = isBusy;
        txt.disabled = isBusy;
      }

      async function sendMessage() {
        const message = txt.value.trim();
        if (!message || busy) return;

        setBusy(true);
        addMessage({ from: 'user', text: message });
        txt.value = '';
        document.getElementById('charCount').textContent = '0';

        const typing = showTyping();

        try {
          const res = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message, channel: 'web' })
          });
          const data = await res.json();
          typing.remove();

          if (data?.text) {
            addMessage({ from: 'agent', text: data.text });

            const lowerText = data.text.toLowerCase();
            if (lowerText.includes('hold on for a moment') || lowerText.includes('creating the ticket now')) {
              setTimeout(() => {
                txt.value = "what's the update";
                document.getElementById('charCount').textContent = txt.value.length;
                sendMessage();
              }, 2000);
            }
          } else {
            addMessage({ from: 'agent', text: 'Sorry — no reply received.' });
          }
        } catch (err) {
          typing.remove();
          addMessage({ from: 'agent', text: 'Sorry — something went wrong. Try again?' });
        } finally {
          setBusy(false);
          txt.focus();
          scrollToBottom();
        }
      }

      async function init() {
        setBusy(true);
        try {
          const res = await fetch('/api/chat/init', { method: 'POST' });
          if (!res.ok) throw new Error();
          const data = await res.json();
          sessionId = data.sessionId;
          addMessage({ from: 'agent', text: data.text || 'Hello, thank you for contacting InfiNET Broadband. I am your AI assistant. Nice to meet you.' });
        } catch {
          addMessage({ from: 'agent', text: 'Connection issue. Please try again later.' });
        } finally {
          setBusy(false);
          scrollToBottom();
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      txt.addEventListener('input', () => {
        document.getElementById('charCount').textContent = txt.value.length;
      });

      function scrollToBottom() {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      function handleResize() {
        scrollToBottom();
      }

      window.addEventListener('resize', handleResize);

      txt.addEventListener('focus', () => {
        setTimeout(scrollToBottom, 100);
        setTimeout(scrollToBottom, 300);
      });

      const observer = new MutationObserver(() => {
        scrollToBottom();
      });
      observer.observe(messagesEl, { childList: true });

      window.addEventListener('load', () => {
        setTimeout(() => {
          scrollToBottom();
          if (!txt.disabled) txt.focus();
        }, 100);
      });

      // Initialize chat
      init();

      // Ensure initial render is visible
      setTimeout(() => {
        scrollToBottom();
      }, 150);
    })();
  </script>
</body>
</html>
