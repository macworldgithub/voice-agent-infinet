<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>InfiNET Support Chat</title>
  <style>
    :root {
      --bg: #071025;
      --card: #081224;
      --muted: #a0b3d0;
      --accent: #00c2b3;
      --accent-2: #3b82f6;
      --glass: rgba(255,255,255,0.035);
      --radius: 16px;
      --fs-base: clamp(13.5px, 3.1vw, 15px);
      --spacing: clamp(10px, 3vw, 16px);
      --vh: 1vh;
      --safe-top: 0px;
      --safe-bottom: 0px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base);
      color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html {
      width: 100%;
      height: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: linear-gradient(165deg, #031022 0%, #0b223f 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: fixed;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .widget {
      position: fixed;
      left: 8px;
      right: 8px;
      top: calc(8px + var(--safe-top));
      bottom: calc(8px + var(--safe-bottom));
      width: auto;
      height: auto;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .header {
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(59,130,246,0.09), rgba(0,194,179,0.06));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      flex: 1; 
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      font-weight: 700;
      font-size: 15px;
      display: grid;
      place-items: center;
      box-shadow: 0 3px 10px rgba(59,130,246,0.3);
      flex-shrink: 0;
    }

    .title h4 { 
      font-size: clamp(14.5px, 3.8vw, 16px);
      margin: 0;
    }

    .title p { 
      font-size: clamp(11px, 2.9vw, 12px);
      color: var(--muted);
      margin-top: 2px;
      margin: 2px 0 0 0;
    }

    .status { 
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(11px, 2.9vw, 12.5px);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot { 
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online { 
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e80;
    }

    /* CRITICAL: Messages container must be scrollable */
    .messages-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .messages {
      flex: 1;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      padding: var(--spacing);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 3vw, 14px);
      scroll-behavior: smooth;
      min-height: 0;
      /* iOS Safari fix: ensure content is scrollable */
      will-change: scroll-position;
    }

    /* Hide scrollbar but keep scrolling functional */
    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .bubble-row.user {
      align-items: flex-end;
    }

    .msg {
      max-width: 84%;
      padding: clamp(9px, 2.8vw, 12px) clamp(12px, 3.5vw, 15px);
      border-radius: 15px;
      line-height: 1.45;
      font-size: clamp(13.5px, 3.4vw, 14.5px);
      animation: appear 0.24s ease-out forwards;
      opacity: 0;
      transform: translateY(8px);
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }

    .msg.agent {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 15px 15px 15px 5px;
    }

    .msg.user {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-radius: 15px 15px 5px 15px;
    }

    .meta {
      margin-top: 4px;
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--muted);
      opacity: 0.8;
    }

    .bubble-row.user .meta { 
      text-align: right;
    }

    @keyframes appear { 
      to { 
        opacity: 1;
        transform: none;
      }
    }

    /* Composer: fixed at bottom with proper safe area handling */
    .composer {
      padding: clamp(10px, 3vw, 14px) var(--spacing);
      padding-bottom: calc(clamp(10px, 3vw, 14px) + var(--safe-bottom));
      background: rgba(0,0,0,0.28);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      align-items: flex-end;
      z-index: 20;
    }

    .input-wrap { 
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 140px;
      resize: vertical;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      color: inherit;
      font: inherit;
      outline: none;
      line-height: 1.42;
      -webkit-appearance: none;
      -webkit-user-select: text;
      user-select: text;
    }

    @supports (padding: max(0px)) {
      textarea {
        padding: max(11px, calc(11px + env(safe-area-inset-bottom, 0))) max(13px, calc(13px + env(safe-area-inset-right, 0)));
      }
    }

    textarea::placeholder {
      color: var(--muted);
    }

    textarea:focus { 
      border-color: var(--accent);
      box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22);
      -webkit-box-shadow: 0 0 0 2.5px rgba(0,194,179,0.22);
    }

    .hint { 
      font-size: clamp(10px, 2.7vw, 11.5px);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: clamp(13px, 3.4vw, 14.5px);
      min-width: 62px;
      min-height: 46px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      flex-shrink: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:hover:not(:disabled) { 
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled { 
      opacity: 0.48;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 18px 18px 18px 4px;
      font-size: 14px;
      color: var(--muted);
      max-width: 84%;
    }

    .typing-dots { 
      display: flex;
      gap: 4px;
    }

    .typing-dot { 
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { 
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) { 
      animation-delay: 0.4s;
    }

    @keyframes typing { 
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div class="widget" role="region" aria-label="InfiNET customer support chat">
    <div class="header">
      <div class="brand">
        <div class="logo">IN</div>
        <div class="title">
          <h4>InfiNET Support</h4>
          <p>Outages · Billing · Plans</p>
        </div>
      </div>
      <div class="status" id="status">
        <div class="dot online" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    </div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="txt" placeholder="Type your message…" aria-label="Chat message input"></textarea>
        <div class="hint">
          <span id="charCount">0</span>
        </div>
      </div>
      <button class="btn" id="send" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const txt = document.getElementById('txt');
      const sendBtn = document.getElementById('send');

      let sessionId = null;
      let busy = false;
      let keyboardOpen = false;

      function timeNow() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' })[m]);
      }

      function renderMarkdown(text) {
        let html = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\n\s*\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
      }

      function addMessage({ from = 'agent', text = '', meta = '' }) {
        const row = document.createElement('div');
        row.className = `bubble-row ${from === 'user' ? 'user' : ''}`;

        const msg = document.createElement('div');
        msg.className = `msg ${from}`;
        msg.innerHTML = from === 'agent' ? renderMarkdown(text) : escapeHtml(text);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta || timeNow();

        row.append(msg, metaEl);
        messagesEl.appendChild(row);
        scrollToBottom();
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'bubble-row';
        row.innerHTML = `
          <div class="typing-indicator">
            <span>Thinking</span>
            <div class="typing-dots">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function setBusy(isBusy) {
        busy = isBusy;
        sendBtn.disabled = isBusy;
        txt.disabled = isBusy;
      }

      async function sendMessage() {
        const message = txt.value.trim();
        if (!message || busy) return;

        setBusy(true);
        addMessage({ from: 'user', text: message });
        txt.value = '';
        document.getElementById('charCount').textContent = '0';

        const typing = showTyping();

        try {
          const res = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message, channel: 'web' })
          });
          const data = await res.json();
          typing.remove();

          if (data?.text) {
            addMessage({ from: 'agent', text: data.text });

            const lowerText = data.text.toLowerCase();
            if (lowerText.includes('hold on for a moment') || lowerText.includes('creating the ticket now')) {
              setTimeout(() => {
                txt.value = "what's the update";
                document.getElementById('charCount').textContent = txt.value.length;
                sendMessage();
              }, 2000);
            }
          } else {
            addMessage({ from: 'agent', text: 'Sorry — no reply received.' });
          }
        } catch (err) {
          typing.remove();
          addMessage({ from: 'agent', text: 'Sorry — something went wrong. Try again?' });
        } finally {
          setBusy(false);
          scrollToBottom();
        }
      }

      async function init() {
        setBusy(true);
        try {
          const res = await fetch('/api/chat/init', { method: 'POST' });
          if (!res.ok) throw new Error();
          const data = await res.json();
          sessionId = data.sessionId;
          addMessage({ from: 'agent', text: data.text || 'Hello, thank you for contacting InfiNET Broadband. I am your AI assistant. Nice to meet you.' });
        } catch {
          addMessage({ from: 'agent', text: 'Connection issue. Please try again later.' });
        } finally {
          setBusy(false);
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      txt.addEventListener('input', () => {
        document.getElementById('charCount').textContent = txt.value.length;
      });

      function scrollToBottom() {
        window.requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      // iOS: Update viewport height dynamically
      function updateVh() {
        let vHeight;
        
        if (window.visualViewport) {
          vHeight = window.visualViewport.height;
        } else {
          vHeight = window.innerHeight;
        }
        
        const vhValue = (vHeight * 0.01);
        document.documentElement.style.setProperty('--vh', vhValue + 'px');
      }

      // iOS: Update safe area insets
      function updateSafeArea() {
        const safeTop = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0;
        const safeBottom = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0;
        
        const newSafeTop = (env('safe-area-inset-top') || '0px').replace('px', '');
        const newSafeBottom = (env('safe-area-inset-bottom') || '0px').replace('px', '');
        
        // Use CSS env() - fallback to 0
        document.documentElement.style.setProperty('--safe-top', 'max(8px, env(safe-area-inset-top))');
        document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom)');
      }

      function env(variable) {
        const value = getComputedStyle(document.documentElement).getPropertyValue(variable);
        return value ? value.trim() : '0px';
      }

      // Handle visualViewport for iOS keyboard changes
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          updateVh();
          scrollToBottom();
        });
        
        window.visualViewport.addEventListener('scroll', () => {
          updateVh();
        });
      }

      // Fallback for older devices
      window.addEventListener('resize', () => {
        updateVh();
        scrollToBottom();
      });

      // Focus/blur handlers for keyboard
      txt.addEventListener('focus', () => {
        keyboardOpen = true;
        updateVh();
        setTimeout(scrollToBottom, 100);
        setTimeout(scrollToBottom, 300);
      });

      txt.addEventListener('blur', () => {
        keyboardOpen = false;
        setTimeout(updateVh, 100);
        setTimeout(scrollToBottom, 100);
      });

      // Observer for message changes
      const observer = new MutationObserver(() => {
        scrollToBottom();
      });
      
      observer.observe(messagesEl, { childList: true });

      // Initial setup
      updateSafeArea();
      updateVh();
      init();

      // Ensure proper focus and scroll on load
      window.addEventListener('load', () => {
        setTimeout(() => {
          updateVh();
          if (!txt.disabled) {
            txt.focus();
          }
          scrollToBottom();
        }, 200);
      });

      // Store helpers for external access
      window._infinetChatHelpers = { updateVh, scrollToBottom, updateSafeArea };
    })();
  </script>
</body>
</html>
