<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiNET Broadband • AI Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }

        .mic-button {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .recording {
            animation: pulse-ring 1.8s infinite ease-in-out;
        }
        
        .thinking {
            animation: spin 2s linear infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(234, 63, 63, 0.7); }
            70% { box-shadow: 0 0 0 35px rgba(234, 63, 63, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 63, 63, 0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .volume-bar {
            width: 6px;
            background: linear-gradient(to top, #00bfff, #67e8f9);
            border-radius: 9999px;
            transition: height 0.05s ease;
        }

        .end-call {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="bg-slate-900 border-b border-slate-800 px-8 py-5 flex items-center justify-between">
        <div class="flex items-center gap-x-4">
            <div class="w-11 h-11 bg-[#00bfff] rounded-3xl flex items-center justify-center text-3xl shadow-lg">📡</div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight">InfiNET Broadband</h1>
                <p class="text-emerald-400 text-sm">AI Voice Assistant</p>
            </div>
        </div>
        
        <button onclick="newSession()" 
                class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium flex items-center gap-x-2 transition-colors">
            New Conversation
        </button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-6 relative">
        
        <!-- Main Voice Interface -->
        <div class="flex flex-col items-center gap-y-10">
            
            <!-- Status -->
            <div id="status-text" 
                 class="text-2xl font-medium text-slate-300 text-center min-h-[64px] flex items-center">
                Tap the microphone to begin
            </div>

            <!-- Big Mic Button -->
            <button onclick="toggleConversation()"
                    id="mic-button"
                    class="mic-button w-44 h-44 bg-[#00bfff] hover:bg-[#00a8e0] text-white rounded-full flex items-center justify-center text-7xl shadow-2xl shadow-cyan-500/50 focus:outline-none active:scale-95">
                🎤
            </button>

            <!-- Live Volume Indicator -->
            <div id="volume-container" class="flex items-end gap-x-1 h-16 opacity-0 transition-opacity">
                <div id="bar1" class="volume-bar h-4"></div>
                <div id="bar2" class="volume-bar h-6"></div>
                <div id="bar3" class="volume-bar h-10"></div>
                <div id="bar4" class="volume-bar h-14"></div>
                <div id="bar5" class="volume-bar h-8"></div>
            </div>

            <!-- Instruction -->
            <div class="text-slate-400 text-center max-w-xs text-sm leading-relaxed">
                Speak naturally • Mic stays open<br>
                It will auto-detect when you stop speaking
            </div>
        </div>

        <!-- Floating End Call Button -->
        <button onclick="endCall()" 
                id="end-call-btn"
                class="end-call hidden fixed bottom-10 right-10 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-3xl flex items-center gap-x-3 text-sm font-medium shadow-xl">
            <span class="text-xl">✕</span>
            <span>End Call</span>
        </button>
    </div>

    <!-- Footer -->
    <div class="py-6 text-center text-xs text-slate-500">
        Powered by OpenAI • ElevenLabs • InfiNET Broadband
    </div>

    <script>
        const BACKEND_URL = "http://localhost:3003";
        let sessionId = null;
        let isRecording = false;
        let isProcessing = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let silenceTimeout = null;
        let volumeInterval = null;

        const SILENCE_THRESHOLD = 0.5; // seconds

        function playAudio(base64) {
            return new Promise((resolve) => {
                if (!base64) return resolve();
                const audio = new Audio(`data:audio/mp3;base64,${base64}`);
                audio.onended = () => resolve();
                audio.onerror = () => resolve();
                audio.play().catch(() => resolve());
            });
        }

        function setStatus(message, state = "idle") {
            const statusEl = document.getElementById("status-text");
            const micBtn = document.getElementById("mic-button");
            const volumeContainer = document.getElementById("volume-container");
            const endCallBtn = document.getElementById("end-call-btn");

            statusEl.textContent = message;

            micBtn.classList.remove("recording", "bg-red-500", "thinking", "bg-violet-500");

            if (state === "listening") {
                micBtn.classList.add("recording", "bg-red-500");
                micBtn.innerHTML = `<div class="waveform flex gap-1"><div class="bar w-1.5 h-5 bg-white rounded"></div><div class="bar w-1.5 h-8 bg-white rounded"></div><div class="bar w-1.5 h-4 bg-white rounded"></div><div class="bar w-1.5 h-7 bg-white rounded"></div></div>`;
                volumeContainer.classList.add("opacity-100");
                endCallBtn.classList.remove("hidden");
            } 
            else if (state === "thinking") {
                micBtn.classList.add("thinking", "bg-violet-500");
                micBtn.innerHTML = `⟳`;
                volumeContainer.classList.remove("opacity-100");
            } 
            else {
                micBtn.innerHTML = "🎤";
                volumeContainer.classList.remove("opacity-100");
                endCallBtn.classList.add("hidden");
            }
        }

        // Live Volume Visualizer
        function startVolumeVisualizer(stream) {
            if (volumeInterval) clearInterval(volumeInterval);
            
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 64;
            source.connect(analyserNode);

            const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
            const bars = [
                document.getElementById("bar1"),
                document.getElementById("bar2"),
                document.getElementById("bar3"),
                document.getElementById("bar4"),
                document.getElementById("bar5")
            ];

            volumeInterval = setInterval(() => {
                if (!isRecording) return;
                analyserNode.getByteFrequencyData(dataArray);
                let avg = 0;
                for (let i = 0; i < 8; i++) avg += dataArray[i];
                avg = avg / 8;

                const level = Math.min(Math.floor(avg / 3), 100);

                bars.forEach((bar, i) => {
                    const height = Math.max(8, Math.floor(level * (0.6 + i * 0.1)));
                    bar.style.height = `${height}px`;
                });
            }, 60);
        }

        // Voice Activity Detection
        function startSilenceDetection(stream) {
            if (audioContext) audioContext.close();

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);

            analyser.fftSize = 512;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkSilence() {
                if (!isRecording || isProcessing) return;

                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let val of dataArray) sum += val;
                const average = sum / dataArray.length;

                if (average > 22) {
                    if (silenceTimeout) {
                        clearTimeout(silenceTimeout);
                        silenceTimeout = null;
                    }
                } else {
                    if (!silenceTimeout) {
                        silenceTimeout = setTimeout(() => {
                            if (isRecording && !isProcessing) {
                                stopAndSendAudio();
                            }
                        }, SILENCE_THRESHOLD * 1000);
                    }
                }
                requestAnimationFrame(checkSilence);
            }
            checkSilence();
        }

        async function stopAndSendAudio() {
            if (!mediaRecorder || !isRecording || isProcessing) return;

            isProcessing = true;
            isRecording = false;

            if (silenceTimeout) clearTimeout(silenceTimeout);
            if (volumeInterval) clearInterval(volumeInterval);

            mediaRecorder.stop();
            setStatus("Thinking...", "thinking");
        }

        async function startListening() {
            if (isProcessing) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        sampleRate: 16000 
                    }
                });

                mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                    const formData = new FormData();
                    formData.append("audio", audioBlob, "recording.webm");
                    formData.append("sessionId", sessionId);

                    try {
                        const response = await fetch(`${BACKEND_URL}/api/voice`, {
                            method: "POST",
                            body: formData
                        });

                        const result = await response.json();

                        if (result.audioBase64) {
                            await playAudio(result.audioBase64);
                        }
                    } catch (err) {
                        console.error(err);
                    }

                    // Auto restart listening
                    isProcessing = false;
                    setStatus("Listening again...", "listening");
                    startListening();
                };

                mediaRecorder.start(200);
                isRecording = true;
                setStatus("Listening... Speak now", "listening");

                startSilenceDetection(stream);
                startVolumeVisualizer(stream);

            } catch (err) {
                alert("Microphone access denied. Please allow microphone permission.");
                isProcessing = false;
            }
        }

        function toggleConversation() {
            if (isProcessing) return;
            if (isRecording) {
                stopAndSendAudio();
            } else {
                startListening();
            }
        }

        function endCall() {
            if (mediaRecorder && isRecording) mediaRecorder.stop();
            if (volumeInterval) clearInterval(volumeInterval);
            if (audioContext) audioContext.close();
            
            isRecording = false;
            isProcessing = false;
            
            setStatus("Call ended. Tap mic to start again", "idle");
        }

        async function initSession() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/voice-chat/init`, { method: "POST" });
                const data = await res.json();
                sessionId = data.sessionId;

                if (data.audioBase64) {
                    setStatus("Playing welcome message...", "thinking");
                    await playAudio(data.audioBase64);
                }

                setStatus("Ready • Tap mic to speak", "idle");

            } catch (err) {
                alert("Cannot connect to backend server. Make sure it's running on port 3003");
            }
        }

        async function newSession() {
            endCall();
            setTimeout(initSession, 400);
        }

        window.onload = initSession;
    </script>
</body>
</html>
