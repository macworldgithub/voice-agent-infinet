<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiNET Broadband • AI Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        .mic-button { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .recording { animation: pulse-ring 1.8s infinite ease-in-out; }

        .thinking { animation: spin 2s linear infinite; }

        .speaking-glow {
            animation: glow-pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(234, 63, 63, 0.7); }
            70% { box-shadow: 0 0 0 35px rgba(234, 63, 63, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 63, 63, 0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glow-pulse {
            from { box-shadow: 0 0 20px 5px rgba(0, 191, 255, 0.3); }
            to { box-shadow: 0 0 40px 15px rgba(0, 191, 255, 0.6); }
        }

        .volume-bar {
            width: 6px;
            background: linear-gradient(to top, #00bfff, #67e8f9);
            border-radius: 9999px;
            transition: height 0.05s ease;
        }

        .end-call { transition: all 0.3s ease; }

        #transcript-box {
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }
        #transcript-box::-webkit-scrollbar { width: 4px; }
        #transcript-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="bg-slate-900 border-b border-slate-800 px-8 py-5 flex items-center justify-between">
        <div class="flex items-center gap-x-4">
            <div class="w-11 h-11 bg-[#00bfff] rounded-3xl flex items-center justify-center text-3xl shadow-lg">📡</div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight">InfiNET Broadband</h1>
                <p class="text-emerald-400 text-sm">AI Voice Assistant — Realtime</p>
            </div>
        </div>
        <button onclick="newSession()"
                class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium flex items-center gap-x-2 transition-colors">
            New Conversation
        </button>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-6 relative">

        <!-- Main Voice Interface -->
        <div class="flex flex-col items-center gap-y-8">

            <!-- Status -->
            <div id="status-text"
                 class="text-2xl font-medium text-slate-300 text-center min-h-[64px] flex items-center">
                Initializing connections...
            </div>

            <!-- Big Mic Button -->
            <button onclick="toggleMic()"
                    id="mic-button"
                    class="mic-button w-44 h-44 bg-[#00bfff] text-white rounded-full flex items-center justify-center text-7xl shadow-2xl focus:outline-none active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                🎤
            </button>

            <!-- Live Volume Indicator -->
            <div id="volume-container" class="flex items-end gap-x-1 h-16 opacity-0 transition-opacity">
                <div id="bar1" class="volume-bar h-4"></div>
                <div id="bar2" class="volume-bar h-6"></div>
                <div id="bar3" class="volume-bar h-10"></div>
                <div id="bar4" class="volume-bar h-14"></div>
                <div id="bar5" class="volume-bar h-8"></div>
            </div>

            <!-- Live Transcript -->
            <div id="transcript-box"
                 class="w-full max-w-md max-h-40 overflow-y-auto bg-slate-900/60 border border-slate-800 rounded-2xl p-4 text-sm text-slate-300 leading-relaxed hidden">
                <div id="transcript-content"></div>
            </div>

            <!-- Instruction -->
            <div class="text-slate-400 text-center max-w-xs text-sm leading-relaxed">
                Speak naturally • Mic stays open<br>
                AI auto-detects when you stop speaking
            </div>
        </div>

        <!-- Floating End Call Button -->
        <button onclick="endCall()"
                id="end-call-btn"
                class="end-call hidden fixed bottom-10 right-10 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-3xl flex items-center gap-x-3 text-sm font-medium shadow-xl">
            <span class="text-xl">✕</span>
            <span>End Call</span>
        </button>
    </div>

    <!-- Footer -->
    <div class="py-6 text-center text-xs text-slate-500">
        Powered by OpenAI Realtime API • ElevenLabs • InfiNET Broadband
    </div>

    <script>
    (function () {
        // ──────── State ────────
        let socket = null;
        let micStream = null;
        let audioCtx = null;
        let pcmWorklet = null;
        let micSource = null;
        let isMicOpen = false;
        let isReady = false;
        let volumeInterval = null;

        // Playback
        let playbackCtx = null;
        let nextPlayTime = 0;
        let activeSources = [];
        let assistantFullText = "";

        const SAMPLE_RATE = 24000;

        // ──────── UI Helpers ────────
        function setStatus(msg, state) {
            const el = document.getElementById("status-text");
            const btn = document.getElementById("mic-button");
            const vol = document.getElementById("volume-container");
            const endBtn = document.getElementById("end-call-btn");

            el.textContent = msg;
            btn.classList.remove("recording", "bg-red-500", "thinking", "bg-violet-500", "speaking-glow", "bg-[#00bfff]", "bg-slate-700");

            if (state === "listening") {
                btn.classList.add("recording", "bg-red-500");
                btn.innerHTML = '<div class="flex gap-1"><div class="w-1.5 h-5 bg-white rounded animate-pulse"></div><div class="w-1.5 h-8 bg-white rounded animate-pulse" style="animation-delay:.15s"></div><div class="w-1.5 h-4 bg-white rounded animate-pulse" style="animation-delay:.3s"></div><div class="w-1.5 h-7 bg-white rounded animate-pulse" style="animation-delay:.1s"></div></div>';
                vol.classList.add("opacity-100");
                endBtn.classList.remove("hidden");
            } else if (state === "processing") {
                btn.classList.add("thinking", "bg-violet-500");
                btn.innerHTML = "⟳";
                vol.classList.remove("opacity-100");
            } else if (state === "speaking") {
                btn.classList.add("speaking-glow", "bg-[#00bfff]");
                btn.innerHTML = "🔊";
                vol.classList.remove("opacity-100");
            } else {
                btn.classList.add("bg-[#00bfff]");
                btn.innerHTML = "🎤";
                vol.classList.remove("opacity-100");
                if (state === "idle") endBtn.classList.add("hidden");
            }
        }

        function appendTranscript(role, text) {
            const box = document.getElementById("transcript-box");
            const content = document.getElementById("transcript-content");
            box.classList.remove("hidden");
            const line = document.createElement("div");
            line.className = role === "user"
                ? "mb-2 text-cyan-300"
                : "mb-2 text-slate-200";
            line.innerHTML = `<span class="font-semibold text-xs uppercase tracking-wide ${role === 'user' ? 'text-cyan-500' : 'text-emerald-500'}">${role === 'user' ? 'You' : 'AI'}:</span> ${text}`;
            content.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }

        // ──────── PCM16 Audio Capture ────────
        async function startMic() {
            if (isMicOpen) return;

            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, sampleRate: SAMPLE_RATE }
                });
            } catch (e) {
                alert("Microphone access denied.");
                return;
            }

            audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
            micSource = audioCtx.createMediaStreamSource(micStream);

            // Inline AudioWorklet for PCM16 conversion
            const workletCode = `
                class PCM16Processor extends AudioWorkletProcessor {
                    process(inputs) {
                        const ch = inputs[0]?.[0];
                        if (ch) {
                            const i16 = new Int16Array(ch.length);
                            for (let i = 0; i < ch.length; i++) {
                                const s = Math.max(-1, Math.min(1, ch[i]));
                                i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                            }
                            this.port.postMessage(i16.buffer, [i16.buffer]);
                        }
                        return true;
                    }
                }
                registerProcessor('pcm16', PCM16Processor);
            `;
            const blob = new Blob([workletCode], { type: "application/javascript" });
            const url = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(url);
            URL.revokeObjectURL(url);

            pcmWorklet = new AudioWorkletNode(audioCtx, "pcm16");
            pcmWorklet.port.onmessage = (e) => {
                if (socket?.connected) {
                    const bytes = new Uint8Array(e.data);
                    // Use a more efficient conversion method
                    let binary = "";
                    const chunkSize = 8192;
                    for (let i = 0; i < bytes.length; i += chunkSize) {
                        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                    }
                    const b64 = btoa(binary);
                    // Periodic log to confirm data is being sent
                    if (Math.random() < 0.01) console.log(`📤 Sending audio chunk: ${b64.length} chars`);
                    socket.emit("audio_chunk", b64);
                }
            };
            micSource.connect(pcmWorklet);
            pcmWorklet.connect(audioCtx.destination); // needed to keep worklet active (silent)

            isMicOpen = true;
            startVolumeViz();
            setStatus("Listening... Speak now", "listening");
        }

        function stopMic() {
            if (pcmWorklet) { pcmWorklet.disconnect(); pcmWorklet = null; }
            if (micSource) { micSource.disconnect(); micSource = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            if (volumeInterval) { clearInterval(volumeInterval); volumeInterval = null; }
            isMicOpen = false;
        }

        function startVolumeViz() {
            if (volumeInterval) clearInterval(volumeInterval);
            if (!audioCtx || !micSource) return;

            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            micSource.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            const bars = [
                document.getElementById("bar1"), document.getElementById("bar2"),
                document.getElementById("bar3"), document.getElementById("bar4"),
                document.getElementById("bar5"),
            ];

            volumeInterval = setInterval(() => {
                if (!isMicOpen) return;
                analyser.getByteFrequencyData(data);
                let avg = 0;
                for (let i = 0; i < 8; i++) avg += data[i];
                avg /= 8;
                const level = Math.min(Math.floor(avg / 3), 100);
                bars.forEach((bar, i) => {
                    bar.style.height = `${Math.max(8, Math.floor(level * (0.6 + i * 0.1)))}px`;
                });
            }, 60);
        }

        // ──────── MP3 Audio Playback ────────
        let currentAudio = null;
        let audioUnlocked = false;
        let pcmPlaying = false;
        let pcmSampleRate = 16000;

        async function unlockAudioOnce() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            try {
                // Try unlocking both HTMLAudio autoplay and WebAudio policies.
                const a = new Audio();
                a.muted = true;
                a.src = "data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA";
                await a.play().catch(() => {});
                try { a.pause(); } catch (_) {}

                if (!playbackCtx) playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (playbackCtx.state === "suspended") {
                    await playbackCtx.resume().catch(() => {});
                }
            } catch (_) {
                // ignore
            }
        }

        function playAudio(base64) {
            return new Promise((resolve) => {
                if (!base64) return resolve();
                interruptPlayback();
                currentAudio = new Audio(`data:audio/mp3;base64,${base64}`);
                currentAudio.onended = () => { currentAudio = null; resolve(); };
                currentAudio.onerror = () => { currentAudio = null; resolve(); };
                currentAudio.play().catch(() => {
                    setStatus("Audio blocked by browser. Tap mic again to enable sound.", "idle");
                    currentAudio = null;
                    resolve();
                });
            });
        }

        function interruptPlayback() {
            if (currentAudio) {
                try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(_) {}
                currentAudio = null;
            }
            stopPcmPlayback();
        }

        function stopPcmPlayback() {
            pcmPlaying = false;
            nextPlayTime = 0;
            if (activeSources.length) {
                activeSources.forEach((src) => {
                    try { src.stop(0); } catch (_) {}
                });
                activeSources = [];
            }
        }

        function pushPcm16Chunk(base64, sampleRate) {
            if (!base64) return;
            if (!playbackCtx) playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
            pcmSampleRate = sampleRate || 16000;

            let bin;
            try {
                bin = atob(base64);
            } catch (e) {
                console.error("PCM chunk base64 decode failed:", e);
                return;
            }
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const i16 = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));

            // Convert Int16 -> Float32
            const f32 = new Float32Array(i16.length);
            for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

            const audioBuffer = playbackCtx.createBuffer(1, f32.length, pcmSampleRate);
            audioBuffer.copyToChannel(f32, 0, 0);

            const src = playbackCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(playbackCtx.destination);

            const now = playbackCtx.currentTime;
            if (!pcmPlaying || nextPlayTime < now) {
                nextPlayTime = now + 0.02;
                pcmPlaying = true;
            }

            src.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;

            activeSources.push(src);
            src.onended = () => {
                activeSources = activeSources.filter((s) => s !== src);
            };
        }

        // ──────── Socket.IO ────────
        function connectSocket() {
            socket = io(window.location.origin, { transports: ["websocket"] });

            socket.on("connect", () => {
                console.log("✅ Socket.IO connected");
                setStatus("Establishing AI connections...", "processing");
            });

            socket.on("connections_ready", () => {
                console.log("✅ All connections ready");
                isReady = true;
                const btn = document.getElementById("mic-button");
                btn.disabled = false;
                btn.classList.remove("bg-slate-700");
                btn.classList.add("bg-[#00bfff]");

                // Auto-start mic for hands-free experience
                if (!isMicOpen) {
                    startMic();
                }
            });

            socket.on("status", (st) => {
                if (st === "user_speaking") setStatus("Listening...", "listening");
                else if (st === "processing") setStatus("Thinking...", "processing");
                else if (st === "speaking") setStatus("AI is speaking...", "speaking");
                else if (st === "listening") {
                    if (isReady) setStatus("Listening... Speak now", "listening");
                }
            });

            socket.on("user_transcript", (text) => {
                appendTranscript("user", text);
            });

            socket.on("assistant_text_delta", (delta) => {
                assistantFullText += delta;
            });

            socket.on("assistant_text_done", (text) => {
                assistantFullText = "";
                appendTranscript("assistant", text);
            });

            socket.on("audio_complete", async (base64) => {
                console.log("🔊 Received complete audio, playing...");
                setStatus("AI is speaking...", "speaking");
                // Legacy fallback: audio_complete now contains PCM base64 (not MP3). We don't play it here.
                // If you need MP3 fallback, we can emit a separate audio_complete_mp3 event.
                if (isReady && isMicOpen) {
                    setStatus("Listening... Speak now", "listening");
                } else if (isReady) {
                    setStatus("Ready • Tap mic to speak", "idle");
                }
            });

            socket.on("audio_chunk_pcm", (payload) => {
                // payload: { sampleRate, audio }
                setStatus("AI is speaking...", "speaking");
                pushPcm16Chunk(payload?.audio, payload?.sampleRate);
            });

            socket.on("audio_done", () => {
                // Audio is done from server side
                console.log("✅ Audio generation done");
                if (isReady && isMicOpen) {
                    setStatus("Listening... Speak now", "listening");
                } else if (isReady) {
                    setStatus("Ready • Tap mic to speak", "idle");
                }
            });

            socket.on("interrupt", () => {
                interruptPlayback();
                if (isReady && isMicOpen) setStatus("Listening... Speak now", "listening");
            });

            socket.on("audio_interrupt", () => {
                stopPcmPlayback();
                if (isReady && isMicOpen) setStatus("Listening... Speak now", "listening");
            });

            socket.on("error_msg", (msg) => {
                console.error("Server error:", msg);
                setStatus("Error: " + msg, "idle");
            });

            socket.on("disconnect", () => {
                console.log("Socket disconnected");
                isReady = false;
                // Don't stop mic immediately, let auto-reconnect try
                setStatus("Reconnecting to server...", "processing");
            });
        }

        // ──────── Controls ────────
        window.toggleMic = function () {
            unlockAudioOnce();
            if (!isReady && !socket) {
                // First tap: connect everything
                beginSession();
                return;
            }
            if (!isReady) return;
            if (isMicOpen) {
                stopMic();
                setStatus("Mic off • Tap to resume", "idle");
            } else {
                startMic();
            }
        };

        // First mic tap → connect Socket.IO → server opens both WSs → 2s delay → greeting
        async function beginSession() {
            const btn = document.getElementById("mic-button");
            btn.disabled = true;
            setStatus("Connecting... please wait", "processing");

            await unlockAudioOnce();

            connectSocket();
        }

        window.endCall = function () {
            stopMic();
            interruptPlayback();
            if (socket) { socket.disconnect(); socket = null; }
            isReady = false;
            document.getElementById("mic-button").disabled = false;
            document.getElementById("mic-button").classList.remove("bg-slate-700");
            document.getElementById("mic-button").classList.add("bg-[#00bfff]");
            setStatus("Call ended. Tap mic to start again.", "idle");
        };

        window.newSession = function () {
            if (socket) { socket.disconnect(); socket = null; }
            stopMic();
            interruptPlayback();
            isReady = false;
            assistantFullText = "";
            document.getElementById("transcript-content").innerHTML = "";
            document.getElementById("transcript-box").classList.add("hidden");
            document.getElementById("mic-button").disabled = false;
            document.getElementById("mic-button").classList.remove("bg-slate-700");
            document.getElementById("mic-button").classList.add("bg-[#00bfff]");
            setStatus("Tap the microphone to begin", "idle");
        };

        // Page load — just show idle state, no connections yet
        window.addEventListener("load", () => {
            setStatus("Tap the microphone to begin", "idle");
        });
    })();
    </script>
</body>
</html>
